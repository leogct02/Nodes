<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Plataforma de Pagos de Exportación</title>
  <desc id="d">Cobra en moneda internacional, se convierte a USDC y recibe en bolivianos. Atardecer en los Andes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1464"/>
      <stop offset="0.45" stop-color="#9c1f6b"/>
      <stop offset="0.8" stop-color="#ff7043"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffb300"/>
    </radialGradient>
    <pattern id="greca" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#b3202a"/>
      <rect width="48" height="3" fill="#007934"/>
      <path d="M4 24V18H12V12H20V6H28V12H36V18H44V24Z" fill="#f9e300"/>
      <rect x="22" y="14" width="4" height="4" fill="#b3202a"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- Estrellas -->
    <g fill="#ffffff" fill-opacity="0.75">
      <circle cx="120" cy="30" r="1.8"/><circle cx="260" cy="55" r="1.4"/><circle cx="430" cy="24" r="1.8"/>
      <circle cx="610" cy="48" r="1.4"/><circle cx="790" cy="26" r="1.8"/><circle cx="1130" cy="40" r="1.6"/>
    </g>

    <!-- Sol -->
    <circle cx="1010" cy="165" r="68" fill="url(#sun)"/>

    <!-- Montañas traseras -->
    <path d="M0 296V245L150 232L300 248L450 236L600 250L700 205L780 150L860 195L940 172L1060 215L1150 185L1200 205V296Z" fill="#5b1f6e"/>
    <!-- Nieve -->
    <path d="M780 150L752 176L772 170L784 184L798 168L816 176Z" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M940 172L920 190L936 186L946 196L958 184L972 190Z" fill="#ffffff" fill-opacity="0.85"/>
    <!-- Montañas delanteras -->
    <path d="M0 296V262L160 244L300 262L470 246L640 266L800 250L960 270L1100 252L1200 266V296Z" fill="#2a0f45"/>

    <!-- Título -->
    <text x="70" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Plataforma de Pagos de Exportación</text>
    <text x="70" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#fff3e0">Cobra en moneda internacional, recibe en bolivianos</text>

    <!-- Etiquetas: Divisa → USDC → BOB -->
    <rect x="70" y="172" width="140" height="40" rx="20" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-width="2">
      <circle cx="98" cy="192" r="11"/>
      <ellipse cx="98" cy="192" rx="5" ry="11"/>
      <line x1="87" y1="192" x2="109" y2="192"/>
    </g>
    <text x="119" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Divisa</text>
    <text x="238" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">→</text>
    <rect x="266" y="172" width="110" height="40" rx="20" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text x="321" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">USDC</text>
    <text x="404" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">→</text>
    <rect x="432" y="172" width="100" height="40" rx="20" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text x="482" y="199" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">BOB</text>

    <!-- Greca andina -->
    <rect x="0" y="296" width="1200" height="24" fill="url(#greca)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
