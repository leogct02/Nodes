<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Plataforma de Pagos de Exportación</title>
  <desc id="d">Cobra en dólares, recibe en bolivianos</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="0.55" stop-color="#6f42c1"/>
      <stop offset="1" stop-color="#0a8f5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Decoración -->
    <circle cx="1010" cy="90" r="150" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="1130" cy="250" r="110" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="760" cy="300" r="90" fill="#ffffff" fill-opacity="0.05"/>

    <!-- Monedas: USD a BOB -->
    <circle cx="930" cy="150" r="58" fill="#f5c542" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
    <text x="930" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#7a5200" text-anchor="middle">$</text>
    <circle cx="1065" cy="190" r="58" fill="#2da44e" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
    <text x="1065" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">Bs</text>

    <!-- Título -->
    <text x="70" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Plataforma de Pagos de Exportación</text>
    <text x="70" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e8f0ff">Cobra en dólares, recibe en bolivianos</text>

    <!-- Flujo USD → USDC → BOB -->
    <rect x="70" y="205" width="110" height="46" rx="23" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <text x="125" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">USD</text>
    <text x="207" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">→</text>
    <rect x="235" y="205" width="220" height="46" rx="23" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <text x="345" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">USDC · Stellar</text>
    <text x="482" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">→</text>
    <rect x="510" y="205" width="110" height="46" rx="23" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <text x="565" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">BOB</text>

    <!-- Franja con los colores de la bandera de Bolivia -->
    <rect x="0" y="296" width="1200" height="8" fill="#d52b1e"/>
    <rect x="0" y="304" width="1200" height="8" fill="#f9e300"/>
    <rect x="0" y="312" width="1200" height="8" fill="#007934"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
