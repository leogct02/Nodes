<body class="selection:bg-slate-900 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;

    // ========================================================================
    // ICONOS SVG PROFESIONALES (TRAZOS LIMPIOS)
    // ========================================================================
    const SvgIcon = ({ name, className = "w-4 h-4", ...props }) => {
      switch (name) {
        case 'store':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M9 22V12h6v10"/></svg>;
        case 'instagram':
          return <svg className={className} fill="currentColor" viewBox="0 0 24 24" {...props}><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>;
        case 'facebook':
          return <svg className={className} fill="currentColor" viewBox="0 0 24 24" {...props}><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.374 14.5 5 15.5 5H18V0h-3.808C10.595 0 9 1.583 9 4.615V8z"/></svg>;
        case 'arduino':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><rect x="3" y="4" width="18" height="16" rx="2" strokeWidth="1.8"/><circle cx="7" cy="8" r="1.5" fill="currentColor"/><circle cx="17" cy="8" r="1.5" fill="currentColor"/><path strokeLinecap="round" strokeWidth="1.8" d="M7 14h3m-1.5-1.5v3M14 14h3"/></svg>;
        case 'shield':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M9 12l2 2 4-4"/></svg>;
        case 'truck':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><rect x="1" y="3" width="15" height="13" strokeWidth="1.8"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" strokeWidth="1.8"/><circle cx="5.5" cy="18.5" r="2.5" strokeWidth="1.8"/><circle cx="18.5" cy="18.5" r="2.5" strokeWidth="1.8"/></svg>;
        case 'card':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><rect x="1" y="4" width="22" height="16" rx="2" strokeWidth="1.8"/><line x1="1" y1="10" x2="23" y2="10" strokeWidth="1.8"/></svg>;
        case 'check':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><polyline points="20 6 9 17 4 12" strokeWidth="2"/></svg>;
        case 'x':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><line x1="18" y1="6" x2="6" y2="18" strokeWidth="2"/><line x1="6" y1="6" x2="18" y2="18" strokeWidth="2"/></svg>;
        case 'whatsapp':
          return <svg className={className} fill="currentColor" viewBox="0 0 24 24" {...props}><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>;
        case 'terminal':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><polyline points="4 17 10 11 4 5" strokeWidth="2"/><line x1="12" y1="19" x2="20" y2="19" strokeWidth="2"/></svg>;
        case 'share':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><circle cx="18" cy="5" r="3" strokeWidth="1.8"/><circle cx="6" cy="12" r="3" strokeWidth="1.8"/><circle cx="18" cy="19" r="3" strokeWidth="1.8"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" strokeWidth="1.8"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" strokeWidth="1.8"/></svg>;
        default:
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><circle cx="12" cy="12" r="9" strokeWidth="1.8"/></svg>;
      }
    };

    // ========================================================================
    // CATÁLOGO DE PRODUCTOS (FOTOS REALES DE ALTA CALIDAD)
    // ========================================================================
    const INITIAL_PRODUCTS = [
      {
        id: 'prod-cafe',
        name: 'Café Orgánico de Altura (Los Yungas)',
        category: 'Café & Alimentos',
        origin: 'Caranavi, La Paz • 1,750 m.s.n.m.',
        description: 'Micro-lote lavado de estricta altura. Tueste medio artesanal con notas dulces de miel silvestre, chocolate amargo y jazmín. Calificación SCAA: 87.5.',
        weightKg: 0.5,
        producerName: 'Caficultores Bio-Yungas SRL',
        targetNetBob: 480, // Productor recibe exactamente 480 BOB
        priceUsd: 58.00,
        shippingUsd: 16.00,
        imageUrl: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=700&q=80',
        rating: 4.9,
        reviewsCount: 38,
        inStock: true
      },
      {
        id: 'prod-chalina',
        name: 'Chalina Fina 100% Baby Alpaca',
        category: 'Textil & Moda',
        origin: 'Comunidad Textil, La Paz',
        description: 'Tejida en telar tradicional con fibra de primera esquila (19.5 micras). Ultra suave, térmica, hipoalergénica y de extrema durabilidad sin tintes químicos.',
        weightKg: 0.25,
        producerName: 'Manos del Illimani Artesanías',
        targetNetBob: 750, // Productor recibe 750 BOB
        priceUsd: 88.00,
        shippingUsd: 14.00,
        imageUrl: 'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?auto=format&fit=crop&w=700&q=80',
        rating: 5.0,
        reviewsCount: 52,
        inStock: true
      },
      {
        id: 'prod-singani',
        name: 'Singani Gran Reserva Los Cumpas D.O.',
        category: 'Vinos & Licores',
        origin: 'Valle de Santa Ana, Tarija',
        description: 'Destilado insignia de uva Moscatel de Alejandría con Denominación de Origen. Triple destilación en alambique de cobre tradicional. Graduación: 40% Alc.',
        weightKg: 1.2,
        producerName: 'Bodegas de la Sierra SRL',
        targetNetBob: 620, // Productor recibe 620 BOB
        priceUsd: 76.00,
        shippingUsd: 20.00,
        imageUrl: 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=700&q=80',
        rating: 4.8,
        reviewsCount: 29,
        inStock: true
      },
      {
        id: 'prod-cuero',
        name: 'Bolso Artesanal Cuero Curtido Vegetal',
        category: 'Marroquinería',
        origin: 'Tupiza, Potosí',
        description: 'Bolso mensajero fabricado en cuero vacuno plena flor curtido con extractos de quebracho. Herrajes de bronce macizo y costura reforzada de por vida.',
        weightKg: 0.85,
        producerName: 'Taller Cuero Chichas',
        targetNetBob: 1100, // Productor recibe 1,100 BOB
        priceUsd: 132.00,
        shippingUsd: 22.00,
        imageUrl: 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=700&q=80',
        rating: 4.9,
        reviewsCount: 17,
        inStock: true
      }
    ];

    const INITIAL_PRODUCER = {
      businessName: 'Asociación de Caficultores Bio-Yungas SRL',
      legalRepresentative: 'Roberto Mamani Condori',
      ci: '4829103-LP',
      nit: '1029384029',
      taxRegime: 'EXPORTADOR_HABITUAL',
      bankName: 'Banco Nacional de Bolivia (BNB)',
      accountNumber: '150-0928371-29',
      accountHolder: 'Roberto Mamani Condori',
      kycStatus: 'VERIFIED',
      totalDepositedBob: 8640,
      inEscrowBob: 0
    };

    // ========================================================================
    // CONTEXTO DE APLICACIÓN
    // ========================================================================
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [viewMode, setViewMode] = useState('BUYER'); // BUYER | PRODUCER | BACKOFFICE
      const [buyerStyle, setBuyerStyle] = useState('SHOPIFY'); // SHOPIFY | SOCIAL_FEED
      const [isArduinoDrawerOpen, setIsArduinoDrawerOpen] = useState(false);
      const [showHowItWorks, setShowHowItWorks] = useState(false);

      // Modales
      const [checkoutProduct, setCheckoutProduct] = useState(null);
      const [receiptOrder, setReceiptOrder] = useState(null);
      const [taxOrder, setTaxOrder] = useState(null);
      const [socialShareProduct, setSocialShareProduct] = useState(null);

      // Estado Persistente
      const [products, setProducts] = useState(() => {
        const s = localStorage.getItem('nodo_v2_prods');
        return s ? JSON.parse(s) : INITIAL_PRODUCTS;
      });

      const [orders, setOrders] = useState(() => {
        const s = localStorage.getItem('nodo_v2_orders');
        return s ? JSON.parse(s) : [];
      });

      const [producer, setProducer] = useState(() => {
        const s = localStorage.getItem('nodo_v2_prod_info');
        return s ? JSON.parse(s) : INITIAL_PRODUCER;
      });

      const [logs, setLogs] = useState(() => {
        const s = localStorage.getItem('nodo_v2_logs');
        return s ? JSON.parse(s) : [
          {
            id: 'init-1',
            pin: 'D10_NET',
            type: 'INFO',
            title: 'Sistema Conectado',
            desc: 'Stellar Testnet + API Pollar listos para operar.',
            time: '12:00:00'
          }
        ];
      });

      const [marketFx, setMarketFx] = useState(10.50);

      useEffect(() => {
        localStorage.setItem('nodo_v2_prods', JSON.stringify(products));
        localStorage.setItem('nodo_v2_orders', JSON.stringify(orders));
        localStorage.setItem('nodo_v2_prod_info', JSON.stringify(producer));
        localStorage.setItem('nodo_v2_logs', JSON.stringify(logs));
      }, [products, orders, producer, logs]);

      const addLog = (log) => {
        const item = {
          ...log,
          id: `log_${Date.now()}`,
          time: new Date().toLocaleTimeString('es-BO', { hour12: false })
        };
        setLogs(prev => [item, ...prev.slice(0, 30)]);
      };

      // 1. Proceso de Pago en USD (Comprador)
      const submitPayment = async ({ product, buyer, cardLast4, forceDecline }) => {
        const totalUsd = Number((product.priceUsd + product.shippingUsd).toFixed(2));
        
        addLog({
          pin: 'PIN_A0_IN',
          type: 'INFO',
          title: `[ENTRADA USD] Cobro $${totalUsd} USD`,
          desc: `Comprador: ${buyer.name} (${buyer.country}) vía Tarjeta Visa/Mastercard.`
        });

        await new Promise(r => setTimeout(r, 500));

        if (forceDecline) {
          addLog({
            pin: 'PIN_ERR',
            type: 'ERROR',
            title: `[ERROR COBRO] Tarjeta Rechazada`,
            desc: `El banco emisor internacional denegó la transacción por fondos o bloqueo.`
          });
          return { success: false, error: 'Tarjeta denegada por tu banco emisor. Prueba con el botón "Simular Pago Exitoso".' };
        }

        const authCode = `AUTH-${Math.floor(100000 + Math.random() * 900000)}`;
        const orderId = `ORD-${Date.now().toString().slice(-5)}`;
        const stellarHash = '0x' + Array.from({length: 48}, () => Math.floor(Math.random()*16).toString(16)).join('');

        addLog({
          pin: 'D11_STELLAR',
          type: 'SUCCESS',
          title: `[ESCROW BLOQUEADO] Custodia Criptográfica`,
          desc: `Bloqueados $${product.priceUsd} USDC en contrato Stellar. Hash: ${stellarHash.slice(0, 16)}...`
        });

        const newOrder = {
          id: orderId,
          date: new Date().toISOString(),
          product,
          totalUsd,
          netBob: product.targetNetBob,
          status: 'IN_ESCROW', // IN_ESCROW -> DISPATCHED -> SETTLED_BOB -> DISPUTED
          buyer,
          authCode,
          cardLast4,
          tracking: null,
          stellarHash
        };

        setOrders(prev => [newOrder, ...prev]);
        setProducer(p => ({ ...p, inEscrowBob: p.inEscrowBob + product.targetNetBob }));

        return { success: true, order: newOrder };
      };

      // 2. Despachar Pedido (Productor)
      const dispatchOrder = (orderId, courierName, trackingNumber) => {
        const cleanCode = trackingNumber.trim().toUpperCase();
        if (cleanCode.length < 5 || cleanCode === '123' || cleanCode === 'TEST') {
          return { ok: false, msg: 'Código de rastreo inválido o muy corto. Escribe un código real como: DHL-BO-98231' };
        }

        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            return {
              ...o,
              status: 'DISPATCHED',
              tracking: {
                courier: courierName,
                code: cleanCode,
                shippedAt: new Date().toLocaleDateString('es-BO'),
                status: 'En tránsito aéreo internacional'
              }
            };
          }
          return o;
        }));

        addLog({
          pin: 'D12_COURIER',
          type: 'INFO',
          title: `[GUÍA VALIDADA] ${courierName}: ${cleanCode}`,
          desc: `Paquete registrado en aduana aérea de exportación (Viru Viru / El Alto).`
        });

        return { ok: true };
      };

      // 3. Confirmar Entrega y Liquidar en Banco (Pollar Off-ramp)
      const confirmDeliveryAndSettle = async (orderId) => {
        const ord = orders.find(o => o.id === orderId);
        if (!ord) return;

        if (producer.kycStatus !== 'VERIFIED') {
          alert('Tu cuenta aún no está verificada. Por seguridad bancaria debes aprobar el KYC antes de depositar.');
          return;
        }

        addLog({
          pin: 'D13_WEBHOOK',
          type: 'SUCCESS',
          title: `[WEBHOOK ENTREGA] Paquete Recibido`,
          desc: `El comprador firmó la recepción. Disparando liberación automática de fondos.`
        });

        const achRef = `ACH-${Math.floor(10000000 + Math.random() * 90000000)}`;

        addLog({
          pin: 'D09_POLLAR',
          type: 'SUCCESS',
          title: `[DEPÓSITO BANCARIO] +Bs. ${ord.netBob} BOB`,
          desc: `Transferencia ACH directa a ${producer.bankName} (Cta: ${producer.accountNumber}). Ref: ${achRef}.`
        });

        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'SETTLED_BOB', achRef } : o));
        setProducer(p => ({
          ...p,
          totalDepositedBob: p.totalDepositedBob + ord.netBob,
          inEscrowBob: Math.max(0, p.inEscrowBob - ord.netBob)
        }));
      };

      // Reset
      const resetAll = () => {
        localStorage.clear();
        setProducts(INITIAL_PRODUCTS);
        setOrders([]);
        setProducer(INITIAL_PRODUCER);
        setMarketFx(10.50);
        setLogs([{
          id: 'reset',
          pin: 'D10_NET',
          type: 'INFO',
          title: 'Sistema Reiniciado',
          desc: 'Base de datos restaurada para demostración limpia.',
          time: new Date().toLocaleTimeString('es-BO')
        }]);
      };

      return (
        <AppContext.Provider value={{
          viewMode, setViewMode,
          buyerStyle, setBuyerStyle,
          isArduinoDrawerOpen, setIsArduinoDrawerOpen,
          showHowItWorks, setShowHowItWorks,
          checkoutProduct, setCheckoutProduct,
          receiptOrder, setReceiptOrder,
          taxOrder, setTaxOrder,
          socialShareProduct, setSocialShareProduct,
          products, setProducts,
          orders,
          producer, setProducer,
          logs,
          marketFx, setMarketFx,
          submitPayment,
          dispatchOrder,
          confirmDeliveryAndSettle,
          resetAll
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // ========================================================================
    // COMPONENTE: BARRA SUPERIOR PROFESIONAL (ESTILO SHOPIFY & META)
    // ========================================================================
    const TopNavbar = () => {
      const { viewMode, setViewMode, isArduinoDrawerOpen, setIsArduinoDrawerOpen, orders, producer, setShowHowItWorks, resetAll, marketFx } = useApp();
      const pendingOrdersCount = orders.filter(o => o.status === 'IN_ESCROW' || o.status === 'DISPATCHED').length;

      return (
        <header className="sticky top-0 z-40 bg-white border-b border-slate-200">
          {/* Anuncio Superior Minimalista */}
          <div className="bg-slate-900 text-slate-300 text-[11px] py-1 px-4 flex justify-between items-center">
            <div className="flex items-center space-x-2">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              <span><strong>Comercio Transfronterizo:</strong> El comprador paga en USD con tarjeta • El productor recibe en Bolivianos en su banco.</span>
            </div>
            <div className="hidden sm:flex items-center space-x-4">
              <span>Tipo de Cambio Mercado: <strong className="text-emerald-400">1 USD = {marketFx.toFixed(2)} BOB</strong></span>
              <button onClick={() => setShowHowItWorks(true)} className="text-white underline hover:text-emerald-300">
                ¿Cómo funciona?
              </button>
            </div>
          </div>

          {/* Barra de Navegación Principal */}
          <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs text-xs">
          <div className="w-full max-w-2xl bg-white border border-slate-300 rounded shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
              <span className="font-bold">Factura Comercial de Exportación (Tasa Cero IVA)</span>
              <button onClick={() => setTaxOrder(null)}>✕</button>
            </div>

            <div className="overflow-y-auto p-6 space-y-4 text-slate-800" id="print-area">
              <div className="border p-4 rounded space-y-3 font-sans">
                <div className="flex justify-between border-b pb-3">
                  <div>
                    <h4 className="font-bold text-sm">{producer.businessName}</h4>
                    <p className="text-slate-500 text-[11px]">Casa Matriz: La Paz, Bolivia • NIT: {producer.nit}</p>
                  </div>
                  <div className="text-right">
                    <p className="font-bold text-emerald-800">TASA CERO IVA (LEY 843)</p>
                    <p className="text-[11px] font-mono">FAC-EXP-{taxOrder.id}</p>
                  </div>
                </div>

                <div className="p-2 bg-slate-50 border rounded text-[10px] font-mono break-all text-slate-600">
                  CUF: 1029384029B0F9A4819238491C82390192834019283401928340192834019283
                </div>

                <div className="grid grid-cols-2 gap-2 p-2.5 bg-slate-50 rounded text-[11px]">
                  <div>
                    <strong>Importador Extranjero:</strong>
                    <p>{taxOrder.buyer.name} ({taxOrder.buyer.country})</p>
                  </div>
                  <div>
                    <strong>Fecha de Emisión:</strong>
                    <p>{new Date(taxOrder.date).toLocaleDateString('es-BO')}</p>
                  </div>
                </div>

                <table className="w-full text-left text-[11px]">
                  <thead>
                    <tr className="border-b font-bold uppercase text-slate-400">
                      <th className="py-1">Producto</th>
                      <th className="py-1 text-right">FOB USD</th>
                      <th className="py-1 text-right">Flete USD</th>
                      <th className="py-1 text-right">Total USD</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="py-2">{taxOrder.product.name}</td>
                      <td className="py-2 text-right">${taxOrder.product.priceUsd}</td>
                      <td className="py-2 text-right">${taxOrder.product.shippingUsd}</td>
                      <td className="py-2 text-right font-bold">${taxOrder.totalUsd}</td>
                    </tr>
                  </tbody>
                </table>

                <div className="flex justify-between items-center pt-2 border-t">
                  <p className="text-[10px] text-emerald-800 font-bold">EXENTO DE DÉBITO FISCAL POR EXPORTACIÓN DEFINITIVA</p>
                  <p className="font-mono text-xs">Equivalente Oficial (TC 6.96): <strong>Bs. {equivBob} BOB</strong></p>
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-50 border-t flex justify-end space-x-2">
              <button onClick={() => window.print()} className="px-3 py-1.5 bg-slate-200 text-slate-800 font-medium rounded">Imprimir</button>
              <button onClick={() => setTaxOrder(null)} className="px-4 py-1.5 bg-slate-900 text-white font-bold rounded">Cerrar</button>
            </div>
          </div>
        </div>
      );
    };

    // ========================================================================
    // COMPONENTE PRINCIPAL APP
    // ========================================================================
    const App = () => {
      const { viewMode } = useApp();

      return (
        <div className="min-h-screen flex flex-col">
          <TopNavbar />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 pt-6">
            {viewMode === 'BUYER' && <BuyerView />}
            {viewMode === 'PRODUCER' && <ProducerView />}
            {viewMode === 'BACKOFFICE' && <BackofficeView />}
          </main>

          <ArduinoEngineDrawer />
          <HowItWorksModal />
          <SocialShareModal />
          <CheckoutModal />
          <TaxInvoiceModal />

          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
            <p className="font-semibold text-slate-800">NODO | Pasarela Transfronteriza de Pagos & E-commerce</p>
            <p className="text-[11px] text-slate-400 mt-0.5">Compatible con Apache Server / XAMPP / WampServer • Estándar Shopify & Meta Commerce</p>
          </footer>
        </div>
      );
    };

    // Renderizado
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
