  <style>
    :root {
      /* === PALETA OFICIAL DE MARCA (NODES) === */
      --nodes-midnight: #0A0E1A;       /* 55% - 60% | Fondo principal / Seguridad */
      --nodes-white: #FFFFFF;          /* 20% - 25% | Textos principales / Fondos claros */
      --nodes-silver: #A5B1C2;         /* 10% - 15% | Textos secundarios / Bordes / Confianza */
      --nodes-cyan: #00F0FF;           /* 5% - 10%  | Acentos / CTA / Tecnología */

      /* === VARIANTES DE INTERFAZ (UI) === */
      --nodes-surface-dark: #12182B;   /* Tarjetas y contenedores sobre modo oscuro */
      --nodes-surface-light: #F4F7FA;  /* Tarjetas y campos de formulario en modo claro */
      --nodes-border-dark: rgba(165, 177, 194, 0.18);
      --nodes-cyan-hover: #33F3FF;     /* Estado hover en fondo oscuro */
      --nodes-cyan-text-light: #007A8C;/* Cian oscuro legible para enlaces sobre fondo blanco */

      /* === DEGRADADOS PROGRESIVOS === */
      --gradient-brand-dark: linear-gradient(135deg, #00F0FF 0%, #5CE1E6 50%, #A5B1C2 100%);
      --gradient-brand-light: linear-gradient(135deg, #0A0E1A 0%, #006B8F 55%, #00C4D4 100%);
      --gradient-bg-hero: linear-gradient(180deg, #0A0E1A 0%, #11192E 100%);

      /* === ESTADOS FUNCIONALES (ESCROW Y PAGOS) === */
      --status-success: #10B981;       /* Pago liberado / Tracking verificado */
      --status-warning: #F59E0B;       /* Fondos retenidos en Escrow / En tránsito */
      --status-error: #EF4444;         /* Disputa / Pago rechazado */
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FFFFFF;
      color: var(--nodes-midnight);
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }

    /* ===== PATTERN BACKGROUND (CIAN SUAVE EN MOVIMIENTO) ===== */
    .hero-pattern {
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%2300F0FF' stroke-width='0.7' opacity='0.08'%3E%3Ccircle cx='40' cy='40' r='12'/%3E%3Cpath d='M20 10l5 8h-10z'/%3E%3Crect x='55' y='10' width='10' height='10' rx='2'/%3E%3Cpath d='M10 55h10M15 50v10'/%3E%3Cpath d='M60 60l8-4-8-4z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 80px 80px;
      animation: patternSlide 40s linear infinite;
    }

    @keyframes patternSlide {
      from { background-position: 0 0; }
      to { background-position: 240px 160px; }
    }

    /* ===== TEXTOS CON DEGRADADO OFICIAL ===== */
    .gradient-brand-text {
      background: linear-gradient(135deg, #0A0E1A 0%, #007A8C 50%, #00C4D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-cyan-text {
      background: linear-gradient(135deg, #00F0FF 0%, #5CE1E6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== VIEW TRANSITIONS ===== */
    @keyframes fadeInSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-enter { animation: fadeInSlideUp 0.4s ease-out both; }

    /* ===== MARQUEE ===== */
    @keyframes marqueeScroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      animation: marqueeScroll 30s linear infinite;
      width: max-content;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* ===== PULSE GLOW (CIAN OFICIAL) ===== */
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.6); }
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--nodes-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .pulse-dot-green {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--status-success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* ===== DASH PULSE (SVG lines) ===== */
    @keyframes dashPulse {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    /* ===== MODAL / DRAWER ANIMATIONS ===== */
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-enter { animation: scaleIn 0.25s ease-out both; }

    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .drawer-enter { animation: slideInRight 0.35s cubic-bezier(0.16,1,0.3,1) both; }

    @keyframes slideOutRight {
      from { transform: translateX(0); }
      to { transform: translateX(100%); }
    }

    /* ===== FLOAT ===== */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ===== SCROLL REVEAL ===== */
    .sr-hidden { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .sr-visible { opacity: 1; transform: translateY(0); }

    /* ===== TARJETAS NODES ===== */
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(165, 177, 194, 0.25);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 240, 255, 0.45);
      box-shadow: 0 14px 40px -12px rgba(10, 14, 26, 0.08);
    }

    /* ===== NAV INDICATOR (CIAN) ===== */
    .nav-indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      background: var(--nodes-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      border-radius: 2px;
      transition: left 0.3s ease, width 0.3s ease;
    }

    /* ===== HERO ARROW HOVER ===== */
    .arrow-hover span.arr { transition: transform 0.2s ease; display: inline-block; }
    .arrow-hover:hover span.arr { transform: translateX(4px); }

    /* ===== BOTÓN PRINCIPAL NODES ===== */
    .btn-nodes-primary {
      background-color: var(--nodes-midnight);
      color: #FFFFFF;
      border: 1px solid rgba(0, 240, 255, 0.3);
      transition: all 0.2s ease;
    }
    .btn-nodes-primary:hover {
      background-color: #12182B;
      border-color: var(--nodes-cyan);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
    }

    /* ===== PRINT ===== */
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 24px; }
    }

    /* ===== CAROUSEL SNAP ===== */
    .snap-container { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .snap-container > * { scroll-snap-align: start; }

    /* ===== CUSTOM SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #A5B1C2; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #007A8C; }
  </style>
</head>

    const pollarFxService = {

      // Retorna la tasa en vivo actual con micro-variaciones de centavos (mercado real)
      getLiveRate() {
        const delta = (Math.floor(Math.random() * 7) - 3) * 0.01; // -0.03 a +0.03
        this.currentRate = Number(Math.max(10.20, Math.min(10.95, this.currentRate + delta)).toFixed(2));
        this.lastUpdated = new Date();
        return {
          rate: this.currentRate,
          updatedAt: this.lastUpdated.toLocaleTimeString('es-BO', { hour12: false }),
          source: 'Pollar Live FX Stream',
          spreadPct: this.spreadPct
        };
      },

      // Congela una cotización por un tiempo determinado (por defecto 10 min = 600 s)
      createQuoteLock(amountUsd, ttlSeconds = 600) {
        const live = this.getLiveRate();
        const quoteId = `QTE-${Date.now().toString(36).toUpperCase()}-${Math.floor(100 + Math.random() * 900)}`;
        const expiresAt = Date.now() + (ttlSeconds * 1000);
        return {
          quoteId,
          rate: live.rate,
          amountUsd: Number(amountUsd.toFixed(2)),
          estimatedBob: Number((amountUsd * live.rate).toFixed(2)),
          expiresAt,

        description: 'Tejida en telar tradicional con fibra de primera esquila (19.5 micras). Ultra suave, térmica, hipoalergénica y de extrema durabilidad sin tintes químicos.',
        weightKg: 0.25, producerName: 'Manos del Illimani Artesanías',
        targetNetBob: 750, priceUsd: 88.00, shippingUsd: 14.00,
        imageUrl: 'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?auto=format&fit=crop&w=700&q=80',
        rating: 5.0, reviewsCount: 52, inStock: true
      },
      {
        id: 'prod-singani', name: 'Singani Gran Reserva Los Cumpas D.O.', category: 'Vinos & Licores',
        origin: 'Valle de Santa Ana, Tarija',
        description: 'Destilado insignia de uva Moscatel de Alejandría con Denominación de Origen. Triple destilación en alambique de cobre tradicional. Graduación: 40% Alc.',
        weightKg: 1.2, producerName: 'Bodegas de la Sierra SRL',
        targetNetBob: 620, priceUsd: 76.00, shippingUsd: 20.00,
        imageUrl: 'https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=700&q=80',
        rating: 4.8, reviewsCount: 29, inStock: true
      },
      {
        id: 'prod-cuero', name: 'Bolso Artesanal Cuero Curtido Vegetal', category: 'Marroquinería',
        origin: 'Tupiza, Potosí',
        description: 'Bolso mensajero fabricado en cuero vacuno plena flor curtido con extractos de quebracho. Herrajes de bronce macizo y costura reforzada de por vida.',
        weightKg: 0.85, producerName: 'Taller Cuero Chichas',
        targetNetBob: 1100, priceUsd: 132.00, shippingUsd: 22.00,
        imageUrl: 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=700&q=80',
        rating: 4.9, reviewsCount: 17, inStock: true
      }
    ];

    const INITIAL_PRODUCER = {
      businessName: 'Asociación de Caficultores Bio-Yungas SRL',
      legalRepresentative: 'Roberto Mamani Condori',
      ci: '4829103-LP', nit: '1029384029',
      taxRegime: 'EXPORTADOR_HABITUAL',
      bankName: 'Banco Nacional de Bolivia (BNB)',
      accountNumber: '150-0928371-29',
      accountHolder: 'Roberto Mamani Condori',
      kycStatus: 'VERIFIED',
      totalDepositedBob: 8640,
      inEscrowUsdc: 0
    };

    // ========================================================================
    // SCROLL REVEAL HOOK
    // ========================================================================
    const useScrollReveal = () => {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              el.classList.add('sr-visible');
              el.classList.remove('sr-hidden');
              obs.unobserve(el);
            }
          },
          { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
        );
        el.classList.add('sr-hidden');
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    };

    const SR = ({ children, className = '', delay = 0 }) => {
      const ref = useScrollReveal();
      return (
        <div ref={ref} className={`sr-hidden ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    // ========================================================================
    // CONTEXT (ALL STATE + BUSINESS LOGIC)
    // ========================================================================
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [viewMode, setViewMode] = useState('HOME');
      const [buyerStyle, setBuyerStyle] = useState('SHOPIFY');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [showHowItWorks, setShowHowItWorks] = useState(false);

      // Modals
      const [checkoutProduct, setCheckoutProduct] = useState(null);
      const [receiptOrder, setReceiptOrder] = useState(null);
      const [taxOrder, setTaxOrder] = useState(null);
      const [socialShareProduct, setSocialShareProduct] = useState(null);
      const [disputeModalOrder, setDisputeModalOrder] = useState(null);

      // 1. Tipo de Cambio en Vivo de Pollar
      const [liveFx, setLiveFx] = useState(() => pollarFxService.getLiveRate());

      // Helper de sanitización de órdenes para evitar errores de undefined con versiones previas
      const sanitizeOrder = (o, rate) => {
        const escrowUsdc = o.escrowUsdc !== undefined ? o.escrowUsdc : o.product.priceUsd;
        return {
          ...o,
          escrowUsdc,
          checkoutRate: o.checkoutRate || rate,
          checkoutQuoteId: o.checkoutQuoteId || `QTE-INIT-${o.id}`,
          estimatedBobAtPurchase: o.estimatedBobAtPurchase || Number((escrowUsdc * (o.checkoutRate || rate)).toFixed(2)),
          settledRate: o.settledRate !== undefined ? o.settledRate : (o.status === 'SETTLED_BOB' ? 10.48 : null),
          settledBob: o.settledBob !== undefined ? o.settledBob : (o.status === 'SETTLED_BOB' ? (o.netBob || Number((escrowUsdc * 10.48).toFixed(2))) : null),
          settlementQuoteId: o.settlementQuoteId || (o.status === 'SETTLED_BOB' ? `QTE-SETTLED-${o.id}` : null)
        };
      };

      // Persistent State con nodo_v3
      const [products, setProducts] = useState(() => {
        try {
          const s = localStorage.getItem('nodo_v3_prods') || localStorage.getItem('nodo_v2_prods');
          return s ? JSON.parse(s) : INITIAL_PRODUCTS;
        } catch {
          return INITIAL_PRODUCTS;
        }
      });

      const [orders, setOrders] = useState(() => {
        try {
          const s = localStorage.getItem('nodo_v3_orders') || localStorage.getItem('nodo_v2_orders');
          if (!s) return [];
          const parsed = JSON.parse(s);
          return Array.isArray(parsed) ? parsed.map(o => sanitizeOrder(o, 10.48)) : [];
        } catch {
          return [];
        }
      });

      const [producer, setProducer] = useState(() => {
        try {
          const s = localStorage.getItem('nodo_v3_prod_info') || localStorage.getItem('nodo_v2_prod_info');
          if (!s) return INITIAL_PRODUCER;
          const p = JSON.parse(s);
          return {
            ...INITIAL_PRODUCER,
            ...p,
            inEscrowUsdc: p.inEscrowUsdc !== undefined ? p.inEscrowUsdc : (p.inEscrowBob ? Number((p.inEscrowBob / 10.48).toFixed(2)) : 0)
          };
        } catch {
          return INITIAL_PRODUCER;
        }
      });

      const [logs, setLogs] = useState(() => {
        try {
          const s = localStorage.getItem('nodo_v3_logs') || localStorage.getItem('nodo_v2_logs');
          return s ? JSON.parse(s) : [
            {
              id: 'init-1',
              pin: 'PIN_FX_POLLAR',
              type: 'INFO',
              title: 'API Pollar Conectada',
              desc: 'Streaming de tipo de cambio en vivo y mesa de pagos lista.',
              time: '12:00:00'
            }
          ];
        } catch {
          return [{ id: 'init-1', pin: 'PIN_FX_POLLAR', type: 'INFO', title: 'API Pollar Conectada', desc: 'Streaming en vivo activo.', time: '12:00:00' }];
        }
      });

      // Actualización periódica cada 30 segundos (simulación de mercado cambiario)
      useEffect(() => {
        const interval = setInterval(() => {
          setLiveFx(pollarFxService.getLiveRate());
        }, 30000);
        return () => clearInterval(interval);
      }, []);

      // Persistencia en localStorage
      useEffect(() => {
        localStorage.setItem('nodo_v3_prods', JSON.stringify(products));
        localStorage.setItem('nodo_v3_orders', JSON.stringify(orders));
        localStorage.setItem('nodo_v3_prod_info', JSON.stringify(producer));
        localStorage.setItem('nodo_v3_logs', JSON.stringify(logs));
      }, [products, orders, producer, logs]);

      const addLog = (log) => {
        setLogs(prev => [
          {
            ...log,
            id: `log_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
            time: new Date().toLocaleTimeString('es-BO', { hour12: false })
          },
          ...prev.slice(0, 35)
        ]);
      };

      // Función para refrescar manualmente la tasa
      const refreshLiveFx = () => {
        const updated = pollarFxService.getLiveRate();
        setLiveFx(updated);
        addLog({
          pin: 'PIN_FX_POLLAR',
          type: 'INFO',
          title: `[POLLAR LIVE FX] Tasa de mercado: 1 USD = ${updated.rate.toFixed(2)} BOB`,
          desc: `Actualizada vía API Pollar Stream. Spread mesa: ${(updated.spreadPct * 100).toFixed(1)}%.`
        });
        return updated;
      };

      // 1. Proceso de Pago en USD (Comprador) con Quote Lock
      const submitPayment = async ({ product, buyer, cardLast4, forceDecline, quoteLock }) => {
        const totalUsd = Number((product.priceUsd + product.shippingUsd).toFixed(2));
        const quote = quoteLock || pollarFxService.createQuoteLock(totalUsd, 600);
        const escrowUsdc = product.priceUsd; // Valor comercial neto protegido en USDC
        const estimatedBobAtPurchase = Number((escrowUsdc * quote.rate).toFixed(2));

        // Log de congelamiento de cotización
        addLog({
          pin: 'PIN_FX_POLLAR',
          type: 'INFO',
          title: `[QUOTE LOCK] Cotización ${quote.quoteId} fijada @ ${quote.rate.toFixed(2)} BOB/USD`,
          desc: `Bloqueo de tipo de cambio por 600s para evitar variaciones durante el pago del comprador.`
        });

        addLog({
          pin: 'PIN_A0_IN',
          type: 'INFO',
          title: `[ENTRADA USD] Cobro $${totalUsd} USD`,
          desc: `Comprador: ${buyer.name} (${buyer.country}) vía Tarjeta Visa/Mastercard.`
        });

        await new Promise(r => setTimeout(r, 500));

        if (forceDecline) {
          addLog({
            pin: 'PIN_ERR',
            type: 'ERROR',
            title: `[ERROR COBRO] Tarjeta Rechazada`,
            desc: `El banco emisor internacional denegó la transacción por fondos o bloqueo.`
          });
          return { success: false, error: 'Tarjeta denegada por tu banco emisor. Prueba con el botón "Simular Pago Exitoso".' };
        }

        const authCode = `AUTH-${Math.floor(100000 + Math.random() * 900000)}`;
        const orderId = `ORD-${Date.now().toString().slice(-5)}`;
        const stellarHash = '0x' + Array.from({length: 48}, () => Math.floor(Math.random()*16).toString(16)).join('');

        // Log de bloqueo en Stellar respaldado en USDC
        addLog({
          pin: 'D11_STELLAR',
          type: 'SUCCESS',
          title: `[ESCROW USDC] Custodia Criptográfica en Stellar`,
          desc: `Bloqueados $${escrowUsdc.toFixed(2)} USDC en contrato. Libre de riesgo cambiario hasta entrega física. Hash: ${stellarHash.slice(0, 16)}...`
        });

        const newOrder = {
          id: orderId,
          date: new Date().toISOString(),
          product,
          totalUsd,
          escrowUsdc,
          checkoutQuoteId: quote.quoteId,
          checkoutRate: quote.rate,
          estimatedBobAtPurchase,
          settledRate: null,
          settledBob: null,
          settlementQuoteId: null,
          status: 'IN_ESCROW',
          buyer,
          authCode,
          cardLast4,
          tracking: null,
          stellarHash
        };

        setOrders(prev => [newOrder, ...prev]);
        setProducer(p => ({
          ...p,
          inEscrowUsdc: Number(((p.inEscrowUsdc || 0) + escrowUsdc).toFixed(2))
        }));

        return { success: true, order: newOrder };
      };

      // 2. Despachar Pedido (Productor)
      const dispatchOrder = (orderId, courierName, trackingNumber) => {
        const cleanCode = trackingNumber.trim().toUpperCase();
        if (cleanCode.length < 5 || cleanCode === '123' || cleanCode === 'TEST') {
          return { ok: false, msg: 'Código de rastreo inválido o muy corto. Escribe un código real como: DHL-BO-98231' };
        }
        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            return {
              ...o,
              status: 'DISPATCHED',
              tracking: {
                courier: courierName,
                code: cleanCode,
                shippedAt: new Date().toLocaleDateString('es-BO'),
                status: 'En tránsito aéreo internacional'
              }
            };
          }
          return o;
        }));

        addLog({
          pin: 'D12_COURIER',
          type: 'INFO',
          title: `[GUÍA VALIDADA] ${courierName}: ${cleanCode}`,
          desc: `Paquete registrado en aduana aérea de exportación (Viru Viru / El Alto).`
        });

        return { ok: true };
      };

      // 3. Confirmar Entrega y Liquidar en Banco (API Pollar Off-ramp con Settlement Quote Lock)
      const confirmDeliveryAndSettle = async (orderId) => {
        const ord = orders.find(o => o.id === orderId);
        if (!ord) return;

        if (producer.kycStatus !== 'VERIFIED') {
          alert('Tu cuenta aún no está verificada. Por seguridad bancaria debes aprobar el KYC antes de depositar.');
          return;
        }

        addLog({
          pin: 'D13_WEBHOOK',
          type: 'SUCCESS',
          title: `[WEBHOOK ENTREGA] Paquete Recibido`,
          desc: `El comprador firmó la recepción. Disparando liquidación en tiempo real vía API Pollar.`
        });

        // Cotización en vivo de liquidación al momento exacto de la entrega
        const settlementQuote = pollarFxService.createQuoteLock(ord.escrowUsdc, 600);
        const settledBob = Number((ord.escrowUsdc * settlementQuote.rate).toFixed(2));
        const achRef = `ACH-${Math.floor(10000000 + Math.random() * 90000000)}`;

        addLog({
          pin: 'D09_POLLAR',
          type: 'SUCCESS',
          title: `[OFF-RAMP POLLAR] $${ord.escrowUsdc} USDC ➔ Bs. ${settledBob} BOB`,
          desc: `Liquidado a tipo de cambio de mercado @ ${settlementQuote.rate.toFixed(2)} BOB/USD • Ref: ${settlementQuote.quoteId}.`
        });

        addLog({
          pin: 'D09_POLLAR',
          type: 'SUCCESS',
          title: `[DEPÓSITO BANCARIO] +Bs. ${settledBob} BOB`,
          desc: `Transferencia ACH directa a ${producer.bankName} (Cta: ${producer.accountNumber}). Ref: ${achRef}.`
        });

        setOrders(prev => prev.map(o => o.id === orderId ? {
          ...o,
          status: 'SETTLED_BOB',
          achRef,
          settledBob,
          settledRate: settlementQuote.rate,
          settlementQuoteId: settlementQuote.quoteId,
          settledAt: new Date().toISOString()
        } : o));

        setProducer(p => ({
          ...p,
          totalDepositedBob: Number((p.totalDepositedBob + settledBob).toFixed(2)),
          inEscrowUsdc: Math.max(0, Number(((p.inEscrowUsdc || 0) - ord.escrowUsdc).toFixed(2)))
        }));
      };

      // 4. Disputas & Arbitraje
      const openDispute = (orderId, reason, note = '') => {
        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            return {
              ...o,
              status: 'DISPUTED',
              dispute: {
                reason,
                note,
                openedAt: new Date().toISOString()
              }
            };
          }
          return o;
        }));
        addLog({
          pin: 'INT_D12',
          type: 'ERROR',
          title: `[DISPUTA INICIADA] Orden #${orderId}`,
          desc: `Comprador abrió reclamo por: "${reason}". Fondos en garantía congelados para revisión de evidencia.`
        });
      };

      const resolveDispute = (orderId, decision, resolutionNote = '') => {
        const ord = orders.find(o => o.id === orderId);
        if (!ord) return;

        if (decision === 'RELEASE_PRODUCER') {
          const settlementQuote = pollarFxService.createQuoteLock(ord.escrowUsdc, 600);
          const settledBob = Number((ord.escrowUsdc * settlementQuote.rate).toFixed(2));
          const achRef = `ACH-${Math.floor(10000000 + Math.random() * 90000000)}`;

          setOrders(prev => prev.map(o => o.id === orderId ? {
            ...o,
            status: 'SETTLED_BOB',
            achRef,
            settledBob,
            settledRate: settlementQuote.rate,
            settlementQuoteId: settlementQuote.quoteId,
            settledAt: new Date().toISOString(),
            disputeResolution: { decision, note: resolutionNote || 'Arbitraje favorable al productor tras verificar tracking válido del courier.', resolvedAt: new Date().toISOString() }
          } : o));

          setProducer(p => ({
            ...p,
            totalDepositedBob: Number((p.totalDepositedBob + settledBob).toFixed(2)),
            inEscrowUsdc: Math.max(0, Number(((p.inEscrowUsdc || 0) - ord.escrowUsdc).toFixed(2)))
          }));

          addLog({
            pin: 'D09_POLLAR',
            type: 'SUCCESS',
            title: `[ARBITRAJE RESUELTO] Fallo a favor del Productor`,
            desc: `Tracking comprobado. Liberados $${ord.escrowUsdc} USDC ➔ Bs. ${settledBob} BOB a ${settlementQuote.rate.toFixed(2)} (Ref: ${achRef}).`
          });
        } else if (decision === 'REFUND_BUYER') {
          setOrders(prev => prev.map(o => o.id === orderId ? {
            ...o,
            status: 'REFUNDED',
            disputeResolution: { decision, note: resolutionNote || 'Reembolso total acordado con el comprador.', resolvedAt: new Date().toISOString() }
          } : o));

          setProducer(p => ({
            ...p,
            inEscrowUsdc: Math.max(0, Number(((p.inEscrowUsdc || 0) - ord.escrowUsdc).toFixed(2)))
          }));

          addLog({
            pin: 'PIN_A0_IN',
            type: 'INFO',
            title: `[REEMBOLSO EJECUTADO] Comprador Reembolsado`,
            desc: `Devolución de $${ord.totalUsd} USD procesada a la tarjeta **** ${ord.cardLast4} vía contrato Stellar.`
          });
        }
      };

      // Reset
      const resetAll = () => {
        localStorage.removeItem('nodo_v3_prods');
        localStorage.removeItem('nodo_v3_orders');
        localStorage.removeItem('nodo_v3_prod_info');
        localStorage.removeItem('nodo_v3_logs');
        localStorage.removeItem('nodo_v2_prods');
        localStorage.removeItem('nodo_v2_orders');
        localStorage.removeItem('nodo_v2_prod_info');
        localStorage.removeItem('nodo_v2_logs');
        localStorage.removeItem('nodo_v2_fx');
        setProducts(INITIAL_PRODUCTS);
        setOrders([]);
        setProducer(INITIAL_PRODUCER);
        setLiveFx(pollarFxService.getLiveRate());
        setLogs([
          {
            id: 'reset',
            pin: 'PIN_FX_POLLAR',
            type: 'INFO',
            title: 'Sistema Reiniciado',
            desc: 'Base de datos restaurada y streaming Pollar reconectado.',
            time: new Date().toLocaleTimeString('es-BO')
          }
        ]);
        setViewMode('HOME');
      };

      return (
        <AppContext.Provider value={{
          viewMode, setViewMode, buyerStyle, setBuyerStyle,
          isDrawerOpen, setIsDrawerOpen, showHowItWorks, setShowHowItWorks,
          checkoutProduct, setCheckoutProduct, receiptOrder, setReceiptOrder,
          taxOrder, setTaxOrder, socialShareProduct, setSocialShareProduct,
          disputeModalOrder, setDisputeModalOrder,
          products, setProducts, orders, producer, setProducer, logs,
          liveFx, refreshLiveFx, pollarFxService,
          submitPayment, dispatchOrder, confirmDeliveryAndSettle, openDispute, resolveDispute, resetAll
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // ========================================================================
    // NAVBAR (Glass Effect, Minimal)
    // ========================================================================
    const TopNavbar = () => {
      const { viewMode, setViewMode, setIsDrawerOpen, orders, setShowHowItWorks, resetAll, liveFx, refreshLiveFx } = useApp();
      const pending = orders.filter(o => o.status === 'IN_ESCROW' || o.status === 'DISPATCHED').length;
      const disputedCount = orders.filter(o => o.status === 'DISPUTED').length;
      const navRef = useRef(null);
      const [indicator, setIndicator] = useState({ left: 0, width: 0 });

      const tabs = [
        { key: 'HOME', label: 'Inicio' },
        { key: 'BUYER', label: 'Tienda USD' },
        { key: 'PRODUCER', label: 'Productor BOB', badge: pending },
        { key: 'BACKOFFICE', label: 'Finanzas', badge: disputedCount },
      ];

      useEffect(() => {
        if (!navRef.current) return;
        const activeBtn = navRef.current.querySelector(`[data-tab="${viewMode}"]`);
        if (activeBtn) {
          const rect = activeBtn.getBoundingClientRect();
          const parentRect = navRef.current.getBoundingClientRect();
          setIndicator({ left: rect.left - parentRect.left, width: rect.width });
        }
      }, [viewMode]);

      return (
        <header className="sticky top-0 z-40 backdrop-blur-md bg-white/85 border-b border-slate-200/60 shadow-xs">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">

            {/* Logo */}
            <div className="flex items-center space-x-3 cursor-pointer flex-shrink-0" onClick={() => setViewMode('HOME')}>
              {/* Imagotipo para escritorio */}
              <img 
                src="./assets/imagotipo.png" 
                alt="NODES" 
                className="hidden sm:block h-9 w-auto object-contain" 
                onError={(e) => {
                  e.currentTarget.style.display = 'none';
                  const fb = e.currentTarget.parentElement.querySelector('.brand-fallback');
                  if (fb) fb.style.display = 'flex';
                }}
              />
              {/* Isotipo para celulares */}
              <img 
                src="./assets/isotipo.png" 
                alt="NODES" 
                className="block sm:hidden h-8 w-8 object-contain" 
                onError={(e) => {
                  e.currentTarget.style.display = 'none';
                  const fb = e.currentTarget.parentElement.querySelector('.brand-fallback');
                  if (fb) fb.style.display = 'flex';
                }}
              />
              {/* Fallback SVG */}
              <div style={{ display: 'none' }} className="brand-fallback items-center space-x-2">
                <div className="w-9 h-9 bg-[#0A0E1A] rounded-xl flex items-center justify-center border border-[#00F0FF]/30">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle cx="9" cy="9" r="3" fill="#00F0FF"/>
                    <circle cx="9" cy="9" r="7" stroke="#00F0FF" strokeWidth="1.5" strokeDasharray="3 3"/>
                    <circle cx="9" cy="2" r="1.5" fill="#FFFFFF"/>
                    <circle cx="16" cy="9" r="1.5" fill="#FFFFFF"/>
                    <circle cx="9" cy="16" r="1.5" fill="#FFFFFF"/>
                    <circle cx="2" cy="9" r="1.5" fill="#FFFFFF"/>
                  </svg>
                </div>
                <div className="leading-tight">
                  <span className="font-extrabold text-[15px] tracking-tight text-[#0A0E1A]">NODES</span>
                  <span className="block text-[9px] font-semibold text-[#007A8C] uppercase tracking-widest">Bolivia ↔ Global</span>
                </div>
              </div>
            </div>

            {/* Nav Links */}
            <nav ref={navRef} className="hidden md:flex items-center space-x-1 relative">
              {tabs.map(t => (
                <button
                  key={t.key}
                  data-tab={t.key}
                  onClick={() => setViewMode(t.key)}
                  className={`relative px-4 py-2 text-[13px] font-medium transition-colors ${
                    viewMode === t.key ? 'text-nodo-blue font-semibold' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  {t.label}
                  {t.badge > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-4 h-4 bg-nodo-blue text-white text-[9px] font-bold rounded-full flex items-center justify-center">
                      {t.badge}
                    </span>
                  )}
                </button>
              ))}
              <div className="nav-indicator" style={{ left: indicator.left, width: indicator.width }} />
            </nav>

            {/* Indicador de Tasa en Vivo Pollar + Acciones */}
            <div className="flex items-center space-x-2 sm:space-x-3">
              {/* Badge Tasa en Vivo Pollar */}
              <div className="flex items-center space-x-2 px-3 py-1.5 bg-slate-50 border border-slate-200/80 rounded-xl text-xs shadow-2xs">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse flex-shrink-0"></span>
                <div className="hidden sm:block text-[11px] leading-tight text-slate-600">
                  <span className="text-[10px] text-slate-400 block uppercase font-mono">Pollar Live FX</span>
                  <span>1 USD = <strong className="font-mono text-slate-900 font-bold">{liveFx.rate.toFixed(2)} BOB</strong></span>
                </div>
                <div className="sm:hidden font-mono text-[11px] font-bold text-slate-800">
                  {liveFx.rate.toFixed(2)} Bs
                </div>
                <button
                  onClick={refreshLiveFx}
                  className="p-1 text-slate-400 hover:text-nodo-blue hover:bg-slate-200/50 rounded-md transition"
                  title="Actualizar cotización en vivo de Pollar"
                >
                  <Icon name="refresh" className="w-3.5 h-3.5" />
                </button>
              </div>

              <button onClick={() => setShowHowItWorks(true)} className="hidden xl:block text-[12px] text-slate-500 hover:text-nodo-blue transition font-medium">
                ¿Cómo funciona?
              </button>

              <button
                onClick={() => setIsDrawerOpen(true)}
                className="flex items-center space-x-2 px-3 sm:px-3.5 py-2 bg-nodo-dark hover:bg-slate-800 text-white text-[12px] font-semibold rounded-xl transition-all shadow-sm flex-shrink-0"
              >
                <span className="pulse-dot flex-shrink-0"></span>
                <span className="hidden sm:inline font-mono text-[11px]">Motor Invisible</span>
              </button>

              <button onClick={resetAll} className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition" title="Reiniciar demo">
                <Icon name="refresh" className="w-4 h-4" />
              </button>

              {/* Mobile Menu */}
              <select
                value={viewMode}
                onChange={e => setViewMode(e.target.value)}
                className="md:hidden text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white font-medium"
              >
                {tabs.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
              </select>
            </div>
          </div>
        </header>
      );
    };

    const HomeView = () => {
      const { setViewMode, setCheckoutProduct, products } = useApp();
      const carouselRef = useRef(null);

      const scrollCarousel = (dir) => {
        if (!carouselRef.current) return;
        carouselRef.current.scrollBy({ left: dir * 300, behavior: 'smooth' });
      };

      const techPartners = [
        { name: 'Red Stellar (USDC)', desc: 'Escrow criptográfico' },
        { name: 'API Pollar / Mesa de Pagos', desc: 'Off-ramp Bolivia' },
        { name: 'Pagos Tokenizados PCI-DSS', desc: 'Tarjetas internacionales' },
        { name: 'DHL / FedEx Tracking', desc: 'Verificación de envío' },
        { name: 'Banca Local BOB / QR', desc: 'Depósito instantáneo' },
        { name: 'Facturación SIN Tasa Cero', desc: 'Exportación Bolivia' },
      ];

      const actors = [
        { key: 'PRODUCER', label: 'Productor Boliviano', sub: 'Fija precio en BOB', color: 'emerald', icon: 'store', sends: 'Producto + Factura SIN', receives: 'Bs. en su banco' },
        { key: 'PLATFORM', label: 'Plataforma NODO', sub: 'Motor invisible', color: 'blue', icon: 'shield', sends: 'Garantía Escrow', receives: 'Comisión 3%' },
        { key: 'BUYER', label: 'Comprador Internacional', sub: 'Paga en USD', color: 'slate', icon: 'globe', sends: 'Pago con tarjeta USD', receives: 'Producto + Tracking' },
      ];

      return (
        <div className="view-enter">
          {/* Hero */}
          <section className="relative overflow-hidden">
            <div className="hero-pattern absolute inset-0 pointer-events-none"></div>
            <div className="relative max-w-6xl mx-auto px-4 sm:px-6 py-20 sm:py-32">
              <SR>
                <p className="font-mono text-[11px] sm:text-xs text-nodo-blue font-medium tracking-widest uppercase mb-4">
                  01 — Comercio Transfronterizo Bolivia
                </p>
              </SR>
              <SR delay={100}>
                <h1 className="text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight leading-[1.05] mb-6">
                  <span className="text-[#0A0E1A]">Exporta al mundo.</span><br/>
                  <span className="gradient-brand-text">Cobra en Bolivianos.</span><br/>
                  <span className="text-[#0A0E1A]">Sin fricción.</span>
                </h1>
              </SR>
              <SR delay={200}>
                <p className="text-base sm:text-lg text-slate-500 max-w-2xl leading-relaxed mb-8">
                  El comprador internacional paga en dólares con su tarjeta de crédito. El productor boliviano recibe el dinero directamente en su cuenta bancaria en bolivianos, al tipo de cambio de mercado más competitivo.
                </p>
              </SR>
              <SR delay={300}>
                <div className="flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={() => setViewMode('BUYER')}
                    className="arrow-hover inline-flex items-center justify-center space-x-2 px-6 py-3.5 bg-[#0A0E1A] hover:bg-[#12182B] text-white font-semibold rounded-xl transition-all border border-[#00F0FF]/30 hover:border-[#00F0FF] shadow-lg shadow-[#00F0FF]/10 text-sm"
                  >
                    <span>Probar Tienda en Vivo</span>
                    <span className="arr text-[#00F0FF]">→</span>
                  </button>
                  <button
                    onClick={() => setViewMode('PRODUCER')}
                    className="arrow-hover inline-flex items-center justify-center space-x-2 px-6 py-3.5 bg-white hover:bg-[#F4F7FA] text-[#0A0E1A] font-semibold rounded-xl border border-[#A5B1C2]/40 transition-all text-sm"
                  >
                    <span>Panel del Productor</span>
                    <span className="arr text-[#007A8C]">→</span>
                  </button>
                </div>
              </SR>
            </div>
          </section>

          {/* Tech Marquee */}
          <SR>
            <section className="border-y border-slate-100 bg-slate-50/50 py-6 overflow-hidden">
              <p className="text-center text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-4">Impulsado por infraestructura real</p>
              <div className="relative overflow-hidden">
                <div className="marquee-track">
                  {[...techPartners, ...techPartners].map((t, i) => (
                    <div key={i} className="flex-shrink-0 mx-4 px-5 py-3 bg-white border border-slate-200/80 rounded-xl text-center min-w-[180px]">
                      <p className="text-xs font-bold text-slate-800">{t.name}</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">{t.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          </SR>

          {/* Cycle Diagram */}
          <SR>
            <section className="max-w-5xl mx-auto px-4 sm:px-6 py-16 sm:py-24">
              <div className="text-center mb-12">
                <p className="font-mono text-[11px] text-nodo-blue font-medium tracking-widest uppercase mb-2">02 — Ciclo Bidireccional</p>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-nodo-dark tracking-tight">Tres actores, un flujo sin fricción</h2>
                <p className="text-sm text-slate-500 mt-2 max-w-lg mx-auto">Haz clic en cada actor para explorar su panel en el simulador</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {actors.map((a, i) => (
                  <button
                    key={a.key}
                    onClick={() => a.key !== 'PLATFORM' && setViewMode(a.key)}
                    className={`card p-6 text-left group cursor-pointer ${a.key === 'PLATFORM' ? 'ring-2 ring-nodo-blue/20' : ''}`}
                  >
                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-4 ${
                      a.color === 'emerald' ? 'bg-emerald-100 text-emerald-700' :
                      a.color === 'blue' ? 'bg-blue-100 text-nodo-blue' :
                      'bg-slate-100 text-slate-700'
                    }`}>
                      <Icon name={a.icon} className="w-5 h-5" />
                    </div>
                    <h3 className="font-bold text-base text-slate-900 mb-1">{a.label}</h3>
                    <p className="text-xs text-slate-500 mb-3">{a.sub}</p>
                    <div className="space-y-1.5 text-[11px]">
                      <p className="text-slate-500"><span className="font-semibold text-slate-700">Envía:</span> {a.sends}</p>
                      <p className="text-slate-500"><span className="font-semibold text-emerald-700">Recibe:</span> {a.receives}</p>
                    </div>
                    {a.key !== 'PLATFORM' && (
                      <p className="mt-4 text-xs font-semibold text-nodo-blue opacity-0 group-hover:opacity-100 transition-opacity">
                        Ir al panel →
                      </p>
                    )}
                  </button>
                ))}
              </div>

              {/* SVG Connecting Lines */}
              <div className="hidden md:flex justify-center mt-6">
                <svg width="600" height="30" viewBox="0 0 600 30" fill="none">
                  <line x1="100" y1="15" x2="300" y2="15" stroke="#00F0FF" strokeWidth="2.5" strokeDasharray="8 4">
                    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="3s" repeatCount="indefinite"/>
                  </line>
                  <line x1="300" y1="15" x2="500" y2="15" stroke="#00F0FF" strokeWidth="2.5" strokeDasharray="8 4">
                    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="3s" repeatCount="indefinite"/>
                  </line>
                  <circle cx="100" cy="15" r="5" fill="#10B981"/>
                  <circle cx="300" cy="15" r="5" fill="#00F0FF"/>
                  <circle cx="500" cy="15" r="5" fill="#A5B1C2"/>
                </svg>
              </div>
            </section>
          </SR>

          {/* Product Carousel */}
          <SR>
            <section className="max-w-6xl mx-auto px-4 sm:px-6 pb-20">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <p className="font-mono text-[11px] text-nodo-blue font-medium tracking-widest uppercase mb-1">03 — Productos Destacados</p>
                  <h2 className="text-xl sm:text-2xl font-extrabold text-nodo-dark tracking-tight">Desde Bolivia para el mundo</h2>
                </div>
                <div className="flex space-x-2">
                  <button onClick={() => scrollCarousel(-1)} className="w-9 h-9 border border-slate-200 rounded-xl flex items-center justify-center hover:bg-slate-50 transition">
                    <Icon name="chevLeft" className="w-4 h-4 text-slate-600" />
                  </button>
                  <button onClick={() => scrollCarousel(1)} className="w-9 h-9 border border-slate-200 rounded-xl flex items-center justify-center hover:bg-slate-50 transition">
                    <Icon name="chevRight" className="w-4 h-4 text-slate-600" />
                  </button>
                </div>
              </div>

              <div ref={carouselRef} className="flex space-x-5 overflow-x-auto pb-4 snap-container" style={{ scrollbarWidth: 'none' }}>
                {products.map(p => (
                  <div key={p.id} className="card flex-shrink-0 w-72 overflow-hidden">
                    <div className="relative h-48 bg-slate-100">
                      <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover"/>
                      <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-nodo-dark text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-200/50">
                        {p.origin.split('•')[0].trim()}
                      </span>
                    </div>
                    <div className="p-4">
                      <p className="text-[10px] text-slate-400 font-medium">{p.category}</p>
                      <h3 className="font-bold text-sm text-slate-900 mt-0.5 line-clamp-1">{p.name}</h3>
                      <div className="flex items-baseline justify-between mt-3">
                        <span className="text-lg font-bold font-mono text-slate-900">${p.priceUsd}</span>
                        <span className="text-[11px] text-slate-400">+${p.shippingUsd} envío</span>
                      </div>
                      <button
                        onClick={() => { setCheckoutProduct(p); setViewMode('BUYER'); }}
                        className="w-full mt-3 py-2.5 bg-nodo-dark hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center space-x-1.5"
                      >
                        <Icon name="card" className="w-3.5 h-3.5" />
                        <span>Comprar en USD</span>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </SR>
        </div>
      );
    };

    // ========================================================================
    // BUYER VIEW
    // ========================================================================
    const BuyerView = () => {
      const { products, buyerStyle, setBuyerStyle, setCheckoutProduct, setSocialShareProduct, orders, setReceiptOrder, setDisputeModalOrder } = useApp();
      const [categoryFilter, setCategoryFilter] = useState('ALL');
      const filtered = categoryFilter === 'ALL' ? products : products.filter(p => p.category.toLowerCase().includes(categoryFilter.toLowerCase()));

      return (
        <div className="space-y-6 pb-12 view-enter">
          {/* Header + Style Toggle */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-nodo-dark">Vitrina de Productos de Exportación</h2>
              <p className="text-xs text-slate-500 mt-0.5">Productos bolivianos premium con envío internacional y pago en USD</p>
            </div>
            <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl text-xs font-medium">
              <button onClick={() => setBuyerStyle('SHOPIFY')} className={`px-3 py-1.5 rounded-lg transition ${buyerStyle === 'SHOPIFY' ? 'bg-white text-slate-900 font-semibold shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                Catálogo
              </button>
              <button onClick={() => setBuyerStyle('SOCIAL_FEED')} className={`px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${buyerStyle === 'SOCIAL_FEED' ? 'bg-white text-slate-900 font-semibold shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                <Icon name="instagram" className="w-3 h-3 text-pink-500" />
                <span>Feed Social</span>
              </button>
            </div>
          </div>

          {/* Category Filters */}
          <div className="flex space-x-2 overflow-x-auto pb-1 text-xs">
            {['ALL', 'Café', 'Textil', 'Vinos', 'Marroquinería'].map(cat => (
              <button
                key={cat}
                onClick={() => setCategoryFilter(cat)}
                className={`flex-shrink-0 px-3.5 py-2 rounded-xl font-medium border transition ${
                  categoryFilter === cat
                    ? 'bg-nodo-dark text-white border-nodo-dark'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }`}
              >
                {cat === 'ALL' ? 'Todos' : cat}
              </button>
            ))}
          </div>

          {/* SHOPIFY MODE */}
          {buyerStyle === 'SHOPIFY' ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              {filtered.map((p, i) => (
                <SR key={p.id} delay={i * 80}>
                  <div className="card flex flex-col justify-between overflow-hidden h-full">
                    <div>
                      <div className="relative h-56 bg-slate-100 overflow-hidden">
                        <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover transition-transform duration-300 hover:scale-[1.02]"/>
                        <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-nodo-dark text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-200/50">
                          {p.origin.split('•')[0].trim()}
                        </span>
                      </div>
                      <div className="p-4 space-y-2">
                        <div className="flex justify-between items-center text-[11px]">
                          <span className="text-slate-400">{p.category}</span>
                          <span className="text-amber-600 font-semibold">★ {p.rating} ({p.reviewsCount})</span>
                        </div>
                        <h3 className="font-bold text-sm text-slate-900 line-clamp-1">{p.name}</h3>
                        <p className="text-xs text-slate-500 line-clamp-2 leading-relaxed">{p.description}</p>
                        <p className="text-[11px] text-slate-400 pt-1 border-t border-slate-100">Productor: <strong className="text-slate-600">{p.producerName}</strong></p>
                      </div>
                    </div>
                    <div className="p-4 border-t border-slate-100 space-y-2.5">
                      <div className="flex justify-between items-baseline">
                        <div>
                          <span className="text-lg font-bold text-slate-900 font-mono">${p.priceUsd.toFixed(2)}</span>
                          <span className="text-xs text-slate-400 ml-1">USD</span>
                        </div>
                        <span className="text-[11px] text-slate-400">+${p.shippingUsd} DHL</span>
                      </div>
                      <button onClick={() => setCheckoutProduct(p)} className="w-full py-2.5 bg-nodo-dark hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center space-x-1.5">
                        <Icon name="card" className="w-3.5 h-3.5" /><span>Comprar con Tarjeta (USD)</span>
                      </button>
                      <button onClick={() => setSocialShareProduct(p)} className="w-full py-2 bg-white hover:bg-slate-50 text-slate-600 text-xs font-medium border border-slate-200 rounded-xl transition flex items-center justify-center space-x-1">
                        <Icon name="share" className="w-3 h-3" /><span>Compartir</span>
                      </button>
                    </div>
                  </div>
                </SR>
              ))}
            </div>
          ) : (
            /* SOCIAL FEED MODE */
            <div className="max-w-xl mx-auto space-y-6">
              {filtered.map(p => (
                <SR key={p.id}>
                  <div className="card overflow-hidden">
                    <div className="p-3 flex items-center justify-between border-b border-slate-100">
                      <div className="flex items-center space-x-2.5">
                        <div className="w-9 h-9 rounded-full bg-gradient-to-br from-nodo-blue to-indigo-600 text-white flex items-center justify-center text-xs font-bold">
                          {p.producerName.charAt(0)}
                        </div>
                        <div>
                          <p className="font-semibold text-[13px] text-slate-900 flex items-center space-x-1">
                            <span>{p.producerName}</span><span className="text-nodo-blue">✓</span>
                          </p>
                          <p className="text-[10px] text-slate-400">{p.origin}</p>
                        </div>
                      </div>
                    </div>
                    <div className="relative aspect-square bg-slate-100">
                      <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover"/>
                      <div className="absolute bottom-4 left-4 bg-nodo-dark/90 text-white px-3 py-2 rounded-xl backdrop-blur-sm flex items-center space-x-2 text-xs">
                        <Icon name="store" className="w-3.5 h-3.5 text-emerald-400" />
                        <div>
                          <p className="font-bold">{p.name}</p>
                          <p className="text-[10px] text-slate-300">${p.priceUsd} USD • Envío asegurado</p>
                        </div>
                      </div>
                    </div>
                    <div className="p-4 space-y-3">
                      <div className="flex justify-between items-center">
                        <div className="flex space-x-3 text-sm text-slate-700">
                          <span>❤️ {p.reviewsCount * 4 + 12}</span>
                          <span>💬 {p.reviewsCount}</span>
                          <button onClick={() => setSocialShareProduct(p)} className="hover:text-nodo-blue transition">↗ Compartir</button>
                        </div>
                        <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-lg">Escrow 100%</span>
                      </div>
                      <p className="text-xs text-slate-700"><strong className="mr-1">{p.producerName}</strong>{p.description}</p>
                      <div className="pt-2 border-t border-slate-100 flex space-x-2">
                        <button onClick={() => setCheckoutProduct(p)} className="flex-1 py-2.5 bg-nodo-dark hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5">
                          <Icon name="card" className="w-3.5 h-3.5" /><span>Comprar (${(p.priceUsd + p.shippingUsd).toFixed(2)} USD)</span>
                        </button>
                        <button onClick={() => setSocialShareProduct(p)} className="px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl border border-slate-200">
                          Compartir
                        </button>
                      </div>
                    </div>
                  </div>
                </SR>
              ))}
            </div>
          )}

          {/* Orders Section */}
          <SR>
            <div className="pt-6 border-t border-slate-200 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-base text-nodo-dark">Mis Compras y Seguimiento de Envíos</h3>
                <span className="text-xs text-slate-500">{orders.length} pedidos registrados</span>
              </div>
              {orders.length === 0 ? (
                <div className="card p-6 text-center text-sm text-slate-400">
                  No has simulado ninguna compra en esta sesión. Selecciona un producto arriba y completa el checkout.
                </div>
              ) : (
                <div className="space-y-4">
                  {orders.map(o => {
                    const stepIndex = o.status === 'SETTLED_BOB' ? 4 : o.status === 'DISPATCHED' ? 3 : (o.status === 'DISPUTED' || o.status === 'REFUNDED') ? 2 : 2;
                    return (
                      <div key={o.id} className="card p-5 space-y-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-mono font-bold text-xs bg-slate-100 px-2.5 py-1 rounded-lg text-slate-800">{o.id}</span>
                              <span className="font-bold text-sm text-slate-900">{o.product.name}</span>
                            </div>
                            <p className="text-xs text-slate-500 mt-1">
                              Total: <strong>${o.totalUsd} USD</strong> • Tarjeta: **** {o.cardLast4} • Destino: {o.buyer.country}
                            </p>
                            {o.tracking && (
                              <p className="text-[11px] text-nodo-blue font-mono mt-0.5">
                                Guía {o.tracking.courier}: <strong>{o.tracking.code}</strong> • {o.tracking.status}
                              </p>
                            )}
                          </div>
                          <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                            <button
                              onClick={() => setReceiptOrder(o)}
                              className="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-medium rounded-xl border border-slate-200 transition"
                            >
                              Ver Recibo
                            </button>
                            {o.status === 'SETTLED_BOB' ? (
                              <span className="px-3 py-1.5 bg-emerald-50 text-emerald-800 text-xs font-bold rounded-xl border border-emerald-200">
                                Entregado & Liquidado ✓
                              </span>
                            ) : o.status === 'DISPATCHED' ? (
                              <span className="px-3 py-1.5 bg-blue-50 text-blue-800 text-xs font-bold rounded-xl border border-blue-200">
                                En Tránsito Aéreo
                              </span>
                            ) : o.status === 'DISPUTED' ? (
                              <span className="px-3 py-1.5 bg-red-50 text-red-800 text-xs font-bold rounded-xl border border-red-200 flex items-center space-x-1">
                                <Icon name="warning" className="w-3.5 h-3.5 text-red-600" />
                                <span>En Arbitraje</span>
                              </span>
                            ) : o.status === 'REFUNDED' ? (
                              <span className="px-3 py-1.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl border border-slate-300">
                                Reembolsado al Comprador
                              </span>
                            ) : (
                              <span className="px-3 py-1.5 bg-amber-50 text-amber-800 text-xs font-bold rounded-xl border border-amber-200">
                                Fondos en Garantía Escrow
                              </span>
                            )}
                            {(o.status === 'IN_ESCROW' || o.status === 'DISPATCHED') && (
                              <button
                                onClick={() => setDisputeModalOrder(o)}
                                className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 text-xs font-medium rounded-xl border border-red-200 transition"
                              >
                                Abrir Disputa
                              </button>
                            )}
                          </div>
                        </div>

                        {/* Stepper de 4 Pasos Visual */}
                        <div className="p-3 bg-slate-50/70 border border-slate-200/60 rounded-xl">
                          <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2.5">
                            Ciclo de Protección de Compra:
                          </p>
                          <div className="grid grid-cols-4 gap-2 text-center text-[10px]">
                            <div className={`p-2 rounded-lg font-medium border ${stepIndex >= 1 ? 'bg-white border-emerald-300 text-emerald-900 shadow-xs' : 'bg-slate-100 border-transparent text-slate-400'}`}>
                              <span className="block font-bold">1. Pago USD</span>
                              <span className="text-[9px] text-slate-500">Tarjeta aprobada</span>
                            </div>
                            <div className={`p-2 rounded-lg font-medium border ${stepIndex >= 2 ? 'bg-white border-emerald-300 text-emerald-900 shadow-xs' : 'bg-slate-100 border-transparent text-slate-400'}`}>
                              <span className="block font-bold">2. Escrow Stellar</span>
                              <span className="text-[9px] text-slate-500">Fondos bloqueados</span>
                            </div>
                            <div className={`p-2 rounded-lg font-medium border ${stepIndex >= 3 ? 'bg-white border-emerald-300 text-emerald-900 shadow-xs' : 'bg-slate-100 border-transparent text-slate-400'}`}>
                              <span className="block font-bold">3. Courier Aéreo</span>
                              <span className="text-[9px] text-slate-500">Guía confirmada</span>
                            </div>
                            <div className={`p-2 rounded-lg font-medium border ${stepIndex >= 4 ? 'bg-white border-emerald-300 text-emerald-900 shadow-xs' : 'bg-slate-100 border-transparent text-slate-400'}`}>
                              <span className="block font-bold">4. Liquidación BOB</span>
                              <span className="text-[9px] text-slate-500">Depósito en banco</span>
                            </div>
                          </div>
                        </div>

                        {/* Banner de Disputa Activa si corresponde */}
                        {o.status === 'DISPUTED' && o.dispute && (
                          <div className="p-3.5 bg-red-50/80 border border-red-200 rounded-xl text-xs space-y-1">
                            <div className="flex items-center space-x-2 text-red-900 font-bold">
                              <Icon name="warning" className="w-4 h-4 text-red-600 flex-shrink-0" />
                              <span>Disputa en revisión por el Centro de Riesgo NODO</span>
                            </div>
                            <p className="text-red-700 text-[11px]">
                              <strong>Motivo:</strong> {o.dispute.reason}
                            </p>
                            {o.dispute.note && (
                              <p className="text-red-600 text-[11px] italic">"{o.dispute.note}"</p>
                            )}
                            <p className="text-[10px] text-red-500 pt-1">
                              Los fondos de esta orden permanecen retenidos. El equipo de arbitraje en "Finanzas" está evaluando la guía de transporte.
                            </p>
                          </div>
                        )}

                        {/* Banner de Disputa Resuelta */}
                        {o.disputeResolution && (
                          <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-[11px] text-slate-700">
                            <strong>Resolución de arbitraje:</strong> {o.disputeResolution.note}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </SR>
        </div>
      );
    };

    // ========================================================================
    // PRODUCER VIEW
    // ========================================================================
    const ProducerView = () => {
      const { producer, setProducer, orders, liveFx, refreshLiveFx, dispatchOrder, confirmDeliveryAndSettle, setTaxOrder } = useApp();
      const [prodTab, setProdTab] = useState('ORDERS');
      const [targetBobInput, setTargetBobInput] = useState(500);
      const [activeDispatchId, setActiveDispatchId] = useState(null);
      const [courier, setCourier] = useState('DHL Express');
      const [trackingCode, setTrackingCode] = useState('DHL-BO-98231');
      const [dispatchErr, setDispatchErr] = useState(null);

      // Total retenido en Escrow en USDC y su equivalente estimado en BOB en vivo
      const activeEscrowOrders = orders.filter(o => o.status === 'IN_ESCROW' || o.status === 'DISPATCHED');
      const totalEscrowUsdc = Number(activeEscrowOrders.reduce((acc, o) => acc + (o.escrowUsdc || 0), 0).toFixed(2));
      const totalEscrowBobEstimated = Number((totalEscrowUsdc * liveFx.rate).toFixed(2));

      // Calculadora conectada en vivo a la tasa de Pollar
      const netUsdNeeded = targetBobInput / liveFx.rate;
      const finalPriceForForeigner = Number(((netUsdNeeded + 0.30) / (1 - 0.069)).toFixed(2));
      const officialBankEquiv = Number((netUsdNeeded * 6.96).toFixed(2));
      const extraGainedBob = Number((targetBobInput - officialBankEquiv).toFixed(2));
      const fxGainPercent = (((liveFx.rate - 6.96) / 6.96) * 100).toFixed(1);

      const handleConfirmShip = (orderId) => {
        setDispatchErr(null);
        const res = dispatchOrder(orderId, courier, trackingCode);
        if (!res.ok) setDispatchErr(res.msg);
        else setActiveDispatchId(null);
      };

      const handleSlider = (val) => {
        setTargetBobInput(Number(val));
      };

      return (
        <div className="space-y-6 pb-12 view-enter">
          {/* Summary Card */}
          <SR>
            <div className="card p-6 space-y-5">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-100 pb-4">
                <div>
                  <span className="text-[10px] font-bold text-nodo-blue uppercase tracking-widest">Exportador Acreditado</span>
                  <h2 className="text-lg font-bold text-nodo-dark mt-0.5">{producer.businessName}</h2>
                  <p className="text-xs text-slate-500">Titular: {producer.legalRepresentative} • NIT: {producer.nit}</p>
                </div>
                <div className="text-right text-xs">
                  <span className="text-slate-400 block text-[11px]">Cuenta para abonos en Bolivia:</span>
                  <span className="font-bold text-slate-800">{producer.bankName}</span>
                  <span className="font-mono text-slate-500 block text-[11px]">Cta: {producer.accountNumber}</span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {/* Cobrado en Banco */}
                <div className="p-4 bg-emerald-50/80 border border-emerald-200/60 rounded-2xl">
                  <span className="font-semibold text-emerald-800 block text-[11px]">Cobrado en tu Banco</span>
                  <p className="text-2xl font-bold font-mono text-emerald-900 mt-1">Bs. {producer.totalDepositedBob.toFixed(2)}</p>
                  <p className="text-[10px] text-emerald-600 mt-0.5">Fondos libres acreditados en tu cuenta</p>
                </div>

                {/* En Garantía Escrow USDC */}
                <div className="p-4 bg-amber-50/80 border border-amber-200/60 rounded-2xl">
                  <div className="flex justify-between items-start">
                    <span className="font-semibold text-amber-800 block text-[11px]">En Garantía (Escrow USDC)</span>
                    <span className="text-[10px] font-mono font-bold text-amber-700 bg-amber-100/60 px-2 py-0.5 rounded">Stellar Contract</span>
                  </div>
                  <p className="text-2xl font-bold font-mono text-amber-950 mt-1">${totalEscrowUsdc.toFixed(2)} <span className="text-xs font-normal text-amber-700">USDC</span></p>
                  <p className="text-[11px] font-bold text-amber-900 mt-0.5">~Bs. {totalEscrowBobEstimated.toFixed(2)} <span className="font-normal text-amber-700 text-[10px]">(según tasa Pollar en vivo)</span></p>
                  <p className="text-[10px] text-amber-600 mt-1">Protegido en dólares digitales. Se liquida a BOB al entregar.</p>
                </div>

                {/* Tasa Pollar en Vivo */}
                <div className="p-4 bg-slate-50 border border-slate-200/60 rounded-2xl">
                  <div className="flex justify-between items-start">
                    <span className="font-semibold text-slate-600 block text-[11px]">Tasa en Vivo Pollar</span>
                    <button onClick={refreshLiveFx} className="text-[10px] text-nodo-blue hover:underline flex items-center space-x-1">
                      <span>↺ Actualizar</span>
                    </button>
                  </div>
                  <p className="text-2xl font-bold font-mono text-slate-900 mt-1">{liveFx.rate.toFixed(2)} <span className="text-xs font-normal text-slate-500">BOB/USD</span></p>
                  <p className="text-[10px] text-emerald-600 font-semibold mt-0.5">+{fxGainPercent}% más que oficial (6.96)</p>
                  <p className="text-[10px] text-slate-400 mt-1">Hora: {liveFx.updatedAt} • Micro-variación en tiempo real</p>
                </div>
              </div>
            </div>
          </SR>

          {/* Sub-tabs */}
          <div className="flex border-b border-slate-200 text-xs font-semibold space-x-6">
            {[
              { key: 'ORDERS', label: 'Envíos y Cobros' },
              { key: 'CALCULATOR', label: 'Calculadora Pollar (Tiempo Real)' },
              { key: 'BANK_KYC', label: 'Mi Banco y Documentos' },
            ].map(t => (
              <button
                key={t.key}
                onClick={() => setProdTab(t.key)}
                className={`pb-3 border-b-2 transition ${
                  prodTab === t.key ? 'border-nodo-blue text-nodo-blue font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {/* TAB: ORDERS */}
          {prodTab === 'ORDERS' && (
            <div className="space-y-4 text-xs view-enter">
              {orders.length === 0 ? (
                <div className="card p-10 text-center text-slate-400 text-sm">
                  No hay pedidos pendientes. Ve a la pestaña <strong className="text-nodo-blue">"Tienda USD"</strong> y haz una compra de prueba.
                </div>
              ) : (
                orders.map(o => {
                  const estBobNow = Number(((o.escrowUsdc || o.product.priceUsd) * liveFx.rate).toFixed(2));
                  return (
                    <SR key={o.id}>
                      <div className="card p-5 space-y-3">
                        <div className="flex flex-col sm:flex-row justify-between items-start gap-2">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-mono font-bold bg-slate-100 px-2.5 py-1 rounded-lg text-slate-800">#{o.id}</span>
                              <span className="font-bold text-sm text-slate-900">{o.product.name}</span>
                            </div>
                            <p className="text-slate-500 text-[11px] mt-0.5">
                              Comprador: <strong>{o.buyer.name}</strong> ({o.buyer.country}) • Total cobrado: ${o.totalUsd} USD
                            </p>
                          </div>
                          <div className="flex items-center space-x-2 flex-shrink-0 flex-wrap gap-y-1">
                            <button onClick={() => setTaxOrder(o)} className="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 font-medium rounded-xl hover:bg-slate-50 transition text-xs">
                              Factura SIN
                            </button>
                            {o.status === 'SETTLED_BOB' ? (
                              <span className="px-3 py-1.5 bg-emerald-50 text-emerald-800 font-bold rounded-xl border border-emerald-200 text-xs">
                                +Bs. {o.settledBob || o.netBob} Liquidado en Banco
                              </span>
                            ) : o.status === 'DISPATCHED' ? (
                              <span className="px-3 py-1.5 bg-blue-50 text-blue-800 font-bold rounded-xl border border-blue-200 text-xs">
                                En tránsito aéreo (DHL)
                              </span>
                            ) : o.status === 'DISPUTED' ? (
                              <span className="px-3 py-1.5 bg-red-50 text-red-800 font-bold rounded-xl border border-red-200 text-xs">
                                En revisión de arbitraje
                              </span>
                            ) : o.status === 'REFUNDED' ? (
                              <span className="px-3 py-1.5 bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-300 text-xs">
                                Reembolsado
                              </span>
                            ) : (
                              <span className="px-3 py-1.5 bg-amber-50 text-amber-800 font-bold rounded-xl border border-amber-200 text-xs">
                                Fondos en Custodia USDC
                              </span>
                            )}
                          </div>
                        </div>

                        {/* Detalle Financiero del Escrow y Liquidación */}
                        <div className="p-3 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1 text-xs">
                          {o.status === 'SETTLED_BOB' ? (
                            <div className="text-emerald-900">
                              <p className="font-bold">
                                Depositado: +Bs. {o.settledBob || o.netBob} BOB (Liquidado @ {(o.settledRate || 10.48).toFixed(2)} BOB/USD vía Pollar)
                              </p>
                              <p className="text-[11px] text-emerald-700 font-mono">
                                Cotización de cierre: {o.settlementQuoteId || 'QTE-DIRECT'} • Referencia bancaria ACH: {o.achRef || 'ACH-OK'}
                              </p>
                            </div>
                          ) : (
                            <div>
                              <p className="font-bold text-slate-900">
                                ~Bs. {estBobNow} estimado <span className="font-normal text-slate-500">(Respaldado en ${(o.escrowUsdc || o.product.priceUsd).toFixed(2)} USDC en Stellar)</span>
                              </p>
                              <p className="text-[11px] text-slate-500">
                                Fondos protegidos en dólares digitales (USDC). Se convertirán a bolivianos a la tasa vigente de Pollar al confirmarse la entrega física.
                              </p>
                            </div>
                          )}
                        </div>

                        {/* Despacho Formulario */}
                        {o.status === 'IN_ESCROW' && (
                          activeDispatchId !== o.id ? (
                            <div className="p-4 bg-amber-50/50 border border-amber-200/60 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-amber-900">
                              <span className="text-xs">El cliente pagó en USD. Entrega el paquete al transportista y registra la guía para habilitar el seguimiento internacional.</span>
                              <button
                                onClick={() => { setActiveDispatchId(o.id); setTrackingCode(`DHL-BO-${Math.floor(10000+Math.random()*90000)}`); }}
                                className="flex-shrink-0 px-4 py-2 bg-nodo-dark text-white font-bold rounded-xl hover:bg-slate-800 transition text-xs"
                              >
                                Registrar Guía de Envío
                              </button>
                            </div>
                          ) : (
                            <div className="p-4 bg-white border border-slate-200 rounded-2xl space-y-3">
                              <p className="font-bold text-slate-800 text-xs">Datos de la Guía Aérea:</p>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <select value={courier} onChange={e => setCourier(e.target.value)} className="p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-xs">
                                  <option value="DHL Express">DHL Express</option>
                                  <option value="FedEx International">FedEx International</option>
                                  <option value="Correos de Bolivia (EMS)">Correos de Bolivia (EMS)</option>
                                </select>
                                <input type="text" value={trackingCode} onChange={e => setTrackingCode(e.target.value)} placeholder="Ej: DHL-BO-98231"
