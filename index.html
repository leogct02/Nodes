                                  className="p-2.5 border border-slate-200 rounded-xl font-mono font-bold text-xs"
                                />
                              </div>
                              {dispatchErr && <p className="text-red-600 text-[11px] font-medium">{dispatchErr}</p>}
                              <div className="flex justify-end space-x-2">
                                <button onClick={() => setActiveDispatchId(null)} className="px-3 py-1.5 text-slate-500 text-xs">Cancelar</button>
                                <button onClick={() => handleConfirmShip(o.id)} className="px-4 py-2 bg-nodo-dark text-white font-bold rounded-xl text-xs hover:bg-slate-800 transition">
                                  Confirmar Envío
                                </button>
                              </div>
                            </div>
                          )
                        )}

                        {/* Simular Entrega */}
                        {o.status === 'DISPATCHED' && (
                          <div className="p-4 bg-blue-50/50 border border-blue-200/60 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-blue-900">
                            <div>
                              <span className="text-xs block">Guía en tránsito: <strong>{o.tracking.courier} ({o.tracking.code})</strong></span>
                              <span className="text-[11px] text-blue-700">Al confirmar entrega, se bloqueará la tasa Pollar en vivo y se depositarán los bolivianos en tu cuenta.</span>
                            </div>
                            <button
                              onClick={() => confirmDeliveryAndSettle(o.id)}
                              className="flex-shrink-0 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition text-xs shadow-xs"
                            >
                              Simular Entrega (Liquidar @ {liveFx.rate.toFixed(2)} BOB)
                            </button>
                          </div>
                        )}
                      </div>
                    </SR>
                  );
                })
              )}
            </div>
          )}

          {/* TAB: CALCULATOR */}
          {prodTab === 'CALCULATOR' && (
            <SR>
              <div className="card p-6 space-y-6 view-enter">
                <div className="bg-gradient-to-r from-nodo-dark to-slate-800 text-white p-5 rounded-2xl space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] bg-emerald-400 text-nodo-dark font-bold px-2.5 py-1 rounded-lg">Ganas +{fxGainPercent}% más que en banco oficial</span>
                    <span className="text-xs text-slate-300 font-mono">Tasa Pollar: <strong>{liveFx.rate.toFixed(2)} BOB/USD</strong></span>
                  </div>
                  <h3 className="text-lg font-bold mt-2">Deseas recibir Bs. {targetBobInput.toLocaleString()} líquidos en tu banco</h3>
                  <p className="text-slate-300 text-xs leading-relaxed">
                    A través de un banco tradicional al tipo oficial (6.96) solo recibirías Bs. {officialBankEquiv.toLocaleString()}. Con la mesa de liquidación Pollar obtienes <strong className="text-emerald-300">+Bs. {extraGainedBob.toLocaleString()} BOB adicionales</strong>.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    <label className="font-bold text-sm text-slate-800 block">¿Cuántos Bolivianos líquidos quieres recibir en tu cuenta?</label>
                    <input
                      type="number" step="50" value={targetBobInput}
                      onChange={e => setTargetBobInput(parseFloat(e.target.value) || 0)}
                      className="w-full text-3xl font-bold font-mono p-4 border border-slate-200 rounded-2xl bg-slate-50 text-slate-900 focus:ring-2 focus:ring-nodo-blue/20 focus:border-nodo-blue outline-none transition"
                    />
                    {/* Range Slider */}
                    <input
                      type="range" min="100" max="5000" step="50" value={targetBobInput}
                      onChange={e => handleSlider(e.target.value)}
                      className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-nodo-blue"
                    />
                    <div className="flex justify-between text-[10px] text-slate-400">
                      <span>Bs. 100</span><span>Bs. 5,000</span>
                    </div>

                    <div className="p-3 bg-emerald-50/70 border border-emerald-200 rounded-xl space-y-1 text-xs text-emerald-900">
                      <p className="font-bold">✓ Sin comisiones descontadas de tu pago</p>
                      <p className="text-[11px] text-emerald-700">
                        La tarifa de procesamiento de tarjeta internacional (3.9% + $0.30) y el servicio de la plataforma (3%) se incorporan automáticamente en el precio final en dólares que paga el comprador extranjero.
                      </p>
                    </div>
                  </div>

                  <div className="p-5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
                    <div className="flex justify-between items-start">
                      <span className="font-bold text-slate-500 uppercase text-[10px] tracking-wider">Precio que verá el comprador en el extranjero:</span>
                      <span className="text-[10px] font-mono font-bold bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-600">Catálogo USD</span>
                    </div>
                    <p className="text-4xl font-bold font-mono text-slate-900">${finalPriceForForeigner} <span className="text-sm font-normal text-slate-400">USD</span></p>

                    <div className="pt-3 border-t border-slate-200 space-y-2 text-slate-600 text-xs">
                      <div className="flex justify-between"><span>Valor neto del producto en USD (Escrow):</span><span className="font-mono font-bold">${netUsdNeeded.toFixed(2)} USDC</span></div>
                      <div className="flex justify-between"><span>Comisión tarjeta (3.9% + $0.30):</span><span className="font-mono">${(finalPriceForForeigner * 0.039 + 0.30).toFixed(2)}</span></div>
                      <div className="flex justify-between"><span>Comisión plataforma (3%):</span><span className="font-mono">${(finalPriceForForeigner * 0.03).toFixed(2)}</span></div>
                      <div className="flex justify-between font-bold text-emerald-800 border-t border-slate-200 pt-2 text-sm">
                        <span>Abono neto al entregar (@ {liveFx.rate.toFixed(2)} BOB):</span>
                        <span className="font-mono">Bs. {targetBobInput.toLocaleString()} BOB</span>
                      </div>
                    </div>

                    <div className="p-3 bg-white border border-slate-200 rounded-xl text-[11px] text-slate-500 leading-relaxed">
                      💡 <strong>Transparencia cambiaria:</strong> El precio publicado se fija en <strong>USD</strong>. Durante el tránsito del paquete, el dinero viaja protegido 1:1 en dólares digitales (USDC). Al entregarse, se aplica la tasa en vivo de Pollar de ese día, eliminando el riesgo de devaluación.
                    </div>
                  </div>
                </div>
              </div>
            </SR>
          )}

          {/* TAB: KYC */}
          {prodTab === 'BANK_KYC' && (
            <SR>
              <div className="card p-6 space-y-5 view-enter">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-4">
                  <div>
                    <h3 className="font-bold text-base text-nodo-dark">Datos Bancarios y Verificación</h3>
                    <p className="text-xs text-slate-500 mt-0.5">El titular debe coincidir con el carnet de identidad (norma ASFI)</p>
                  </div>
                  <button
                    onClick={() => setProducer(p => ({ ...p, kycStatus: p.kycStatus === 'VERIFIED' ? 'UNDER_REVIEW' : 'VERIFIED' }))}
                    className={`px-4 py-2 border rounded-xl text-xs font-semibold transition ${
                      producer.kycStatus === 'VERIFIED'
                        ? 'border-amber-300 text-amber-800 bg-amber-50 hover:bg-amber-100'
                        : 'border-emerald-300 text-emerald-800 bg-emerald-50 hover:bg-emerald-100'
                    }`}
                  >
                    {producer.kycStatus === 'VERIFIED' ? 'Probar modo "No Verificado"' : 'Aprobar KYC'}
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                  <div><label className="block text-slate-500 mb-1.5 font-medium">Razón Social</label><input type="text" readOnly value={producer.businessName} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"/></div>
                  <div><label className="block text-slate-500 mb-1.5 font-medium">NIT</label><input type="text" readOnly value={producer.nit} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono"/></div>
                  <div><label className="block text-slate-500 mb-1.5 font-medium">Titular de la Cuenta</label><input type="text" readOnly value={producer.accountHolder} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold"/></div>
                  <div><label className="block text-slate-500 mb-1.5 font-medium">Banco Nacional</label><input type="text" readOnly value={producer.bankName} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"/></div>
                  <div><label className="block text-slate-500 mb-1.5 font-medium">Cédula de Identidad</label><input type="text" readOnly value={producer.ci} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono"/></div>
                  <div><label className="block text-slate-500 mb-1.5 font-medium">Régimen Tributario</label><input type="text" readOnly value="Exportador Habitual" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl"/></div>
                </div>

                {producer.kycStatus === 'VERIFIED' ? (
                  <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-emerald-900 text-xs flex items-center space-x-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                    <span>Documento de identidad y cuenta bancaria verificados. Los bolivianos se depositan automáticamente al confirmar entrega.</span>
                  </div>
                ) : (
                  <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-xs flex items-center space-x-2">
                    <Icon name="warning" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                    <span>Verificación pendiente. No podrás retirar fondos hasta completar el KYC. Haz clic en "Aprobar KYC" para simular la aprobación.</span>
                  </div>
                )}
              </div>
            </SR>
          )}
        </div>
      );
    };

    const BackofficeView = () => {
      const { orders, resolveDispute, liveFx } = useApp();

      return (
        <div className="space-y-6 pb-12 view-enter">
          <SR>
            <div className="card p-6 space-y-5">
              <div>
                <h2 className="font-bold text-xl text-nodo-dark">Mesa de Finanzas y Control de Tiempos</h2>
                <p className="text-sm text-slate-500 mt-1">Conciliación entre el cobro internacional en USD, el Escrow en USDC y la liquidación en BOB vía Pollar</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                {[
                  { step: 'Paso 1', title: 'Cobro USD (Tarjeta)', desc: 'Visa/Mastercard compensan en 48-72h a la cuenta recaudadora.', color: 'slate' },
                  { step: 'Paso 2', title: 'Bóveda Escrow (USDC)', desc: 'Fondos custodiados en Stellar en dólares digitales, eliminando riesgo cambiario en tránsito.', color: 'amber' },
                  { step: 'Paso 3', title: 'Off-Ramp Pollar (BOB)', desc: 'Al confirmar entrega, se congela cotización y se transfiere ACH al banco boliviano en segundos.', color: 'emerald' },
                ].map((s, i) => (
                  <SR key={i} delay={i * 100}>
                    <div className={`p-5 rounded-2xl space-y-2 ${
                      s.color === 'slate' ? 'bg-slate-50 border border-slate-200/60' :
                      s.color === 'amber' ? 'bg-amber-50/80 border border-amber-200/60' :
                      'bg-emerald-50/80 border border-emerald-200/60'
                    }`}>
                      <span className={`font-bold uppercase text-[10px] tracking-wider ${
                        s.color === 'slate' ? 'text-slate-500' : s.color === 'amber' ? 'text-amber-700' : 'text-emerald-700'
                      }`}>{s.step}</span>
                      <p className="font-bold text-slate-900 text-sm">{s.title}</p>
                      <p className="text-slate-600 text-[11px] leading-relaxed">{s.desc}</p>
                    </div>
                  </SR>
                ))}
              </div>
            </div>
          </SR>

          {/* Centro de Resolución de Disputas & Arbitraje */}
          <SR delay={150}>
            <div className="card p-6 space-y-4 border-l-4 border-l-amber-500">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center">
                    <Icon name="gavel" className="w-4 h-4" />
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-nodo-dark">Centro de Resolución de Disputas & Arbitraje</h3>
                    <p className="text-xs text-slate-500">Protección contra contracargos mediante custodia criptográfica Escrow</p>
                  </div>
                </div>
                <span className={`px-2.5 py-1 rounded-xl text-xs font-bold ${
                  orders.filter(o => o.status === 'DISPUTED').length > 0
                    ? 'bg-red-100 text-red-800 animate-pulse'
                    : 'bg-emerald-100 text-emerald-800'
                }`}>
                  {orders.filter(o => o.status === 'DISPUTED').length} Disputas Activas
                </span>
              </div>

              {orders.filter(o => o.status === 'DISPUTED').length === 0 ? (
                <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 text-xs flex items-center space-x-2">
                  <Icon name="check" className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                  <span>Cero disputas abiertas en este momento. Todos los pagos en garantía operan con normalidad. Puedes simular una abriendo un reclamo desde la <strong>Tienda USD</strong>.</span>
                </div>
              ) : (
                <div className="space-y-4">
                  {orders.filter(o => o.status === 'DISPUTED').map(o => (
                    <div key={o.id} className="p-4 bg-red-50/50 border border-red-200 rounded-2xl space-y-3 text-xs">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="font-mono font-bold bg-white px-2 py-0.5 rounded border border-red-200 text-red-900">#{o.id}</span>
                            <span className="font-bold text-slate-900 text-sm">{o.product.name}</span>
                          </div>
                          <p className="text-slate-600 text-xs mt-1">
                            Comprador: <strong>{o.buyer.name}</strong> ({o.buyer.country}) • Monto: <strong>${o.totalUsd} USD</strong> (Escrow: ${(o.escrowUsdc || o.product.priceUsd).toFixed(2)} USDC)
                          </p>
                        </div>
                        <span className="px-2.5 py-1 bg-red-100 text-red-800 rounded-lg font-bold text-[11px]">
                          Reclamo Activo
                        </span>
                      </div>

                      <div className="p-3 bg-white border border-slate-200 rounded-xl space-y-1">
                        <p className="text-slate-700"><strong>Motivo del Reclamo:</strong> {o.dispute?.reason}</p>
                        {o.dispute?.note && <p className="text-slate-500 italic">"{o.dispute.note}"</p>}
                        <p className="text-[11px] text-slate-400">
                          <strong>Estado del Envío:</strong> {o.tracking ? `${o.tracking.courier} (Guía: ${o.tracking.code}) • ${o.tracking.status}` : 'Sin guía registrada aún por el productor'}
                        </p>
                      </div>

                      <div className="flex flex-col sm:flex-row justify-end gap-2 pt-1">
                        <button
                          onClick={() => resolveDispute(o.id, 'REFUND_BUYER')}
                          className="px-4 py-2 bg-white hover:bg-red-50 text-red-700 font-semibold rounded-xl border border-red-300 transition text-xs"
                        >
                          Fallo a favor del Comprador (Reembolsar ${o.totalUsd} USD)
                        </button>
                        <button
                          onClick={() => resolveDispute(o.id, 'RELEASE_PRODUCER')}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition text-xs shadow-xs"
                        >
                          Fallo a favor del Productor (Liquidar @ {liveFx.rate.toFixed(2)} BOB)
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </SR>

          <SR delay={200}>
            <div className="card p-6 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-base text-nodo-dark">Historial de Transacciones Financieras</h3>
                <span className="text-xs font-mono text-slate-500">Tasa Pollar Actual: <strong>{liveFx.rate.toFixed(2)} BOB/USD</strong></span>
              </div>
              {orders.length === 0 ? (
                <p className="text-sm text-slate-400 py-4">Sin movimientos registrados aún.</p>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs min-w-[700px]">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-400 text-[10px] uppercase font-bold">
                        <th className="py-3 pr-3">Orden</th>
                        <th className="py-3 pr-3">Comprador</th>
                        <th className="py-3 pr-3">Cobrado (USD)</th>
                        <th className="py-3 pr-3">Escrow (USDC)</th>
                        <th className="py-3 pr-3">Tasa Pollar</th>
                        <th className="py-3 pr-3">Abono Final (BOB)</th>
                        <th className="py-3">Estado</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {orders.map(o => {
                        const isSettled = o.status === 'SETTLED_BOB';
                        const escrowAmt = (o.escrowUsdc || o.product.priceUsd).toFixed(2);
                        const dynamicBob = ((o.escrowUsdc || o.product.priceUsd) * liveFx.rate).toFixed(2);

                        return (
                          <tr key={o.id} className="hover:bg-slate-50/50 transition">
                            <td className="py-3 pr-3 font-mono font-bold text-slate-800">{o.id}</td>
                            <td className="py-3 pr-3 text-slate-700">{o.buyer.name}</td>
                            <td className="py-3 pr-3 font-mono font-medium">${o.totalUsd}</td>
                            <td className="py-3 pr-3 font-mono text-amber-700 font-bold">${escrowAmt}</td>
                            <td className="py-3 pr-3">
                              {isSettled ? (
                                <span className="font-mono text-emerald-800 font-semibold" title={`Quote Lock: ${o.settlementQuoteId}`}>
                                  Fijada @ {(o.settledRate || 10.48).toFixed(2)}
                                </span>
                              ) : (
                                <span className="font-mono text-slate-600 font-medium">
                                  En vivo @ {liveFx.rate.toFixed(2)}
                                </span>
                              )}
                            </td>
                            <td className="py-3 pr-3 font-mono font-bold">
                              {isSettled ? (
                                <span className="text-emerald-700">Bs. {o.settledBob || o.netBob}</span>
                              ) : (
                                <span className="text-slate-500 font-normal">~Bs. {dynamicBob} <span className="text-[10px] text-slate-400">est.</span></span>
                              )}
                            </td>
                            <td className="py-3">
                              <span className={`px-2.5 py-1 rounded-lg font-semibold text-[11px] ${
                                o.status === 'SETTLED_BOB' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                                o.status === 'DISPATCHED' ? 'bg-blue-50 text-blue-700 border border-blue-200' :
                                o.status === 'DISPUTED' ? 'bg-red-50 text-red-700 border border-red-200' :
                                o.status === 'REFUNDED' ? 'bg-slate-100 text-slate-600 border border-slate-300' :
                                'bg-amber-50 text-amber-700 border border-amber-200'
                              }`}>
                                {o.status === 'SETTLED_BOB' ? 'Liquidado ✓' : o.status === 'DISPATCHED' ? 'En Envío' : o.status === 'DISPUTED' ? 'Disputa' : o.status === 'REFUNDED' ? 'Reembolsado' : 'En Garantía'}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </SR>
        </div>
      );
    };

    const CheckoutModal = () => {
      const { checkoutProduct, setCheckoutProduct, submitPayment, pollarFxService } = useApp();
      const [name, setName] = useState('Michael Vance');
      const [country, setCountry] = useState('Estados Unidos (USA)');
      const [address, setAddress] = useState('452 Market St, San Francisco');
      const [cardNumber, setCardNumber] = useState('4242 •••• •••• 4242');
      const [isBusy, setIsBusy] = useState(false);
      const [err, setErr] = useState(null);

      // Quote Lock congelado por 10 minutos (600 segundos)
      const [quoteLock, setQuoteLock] = useState(null);
      const [timeLeft, setTimeLeft] = useState(600);

      const totalUsd = checkoutProduct ? Number((checkoutProduct.priceUsd + checkoutProduct.shippingUsd).toFixed(2)) : 0;

      // Generar Quote Lock al abrir
      useEffect(() => {
        if (!checkoutProduct) return;
        const total = Number((checkoutProduct.priceUsd + checkoutProduct.shippingUsd).toFixed(2));
        const q = pollarFxService.createQuoteLock(total, 600);
        setQuoteLock(q);
        setTimeLeft(600);
      }, [checkoutProduct]);

      // Contador regresivo en tiempo real
      useEffect(() => {
        if (!quoteLock) return;
        const timer = setInterval(() => {
          const remaining = Math.max(0, Math.floor((quoteLock.expiresAt - Date.now()) / 1000));
          setTimeLeft(remaining);
        }, 1000);
        return () => clearInterval(timer);
      }, [quoteLock]);

      const handleRefreshQuote = () => {
        if (!checkoutProduct) return;
        const total = Number((checkoutProduct.priceUsd + checkoutProduct.shippingUsd).toFixed(2));
        const q = pollarFxService.createQuoteLock(total, 600);
        setQuoteLock(q);
        setTimeLeft(600);
        setErr(null);
      };

      if (!checkoutProduct) return null;

      const formatCountdown = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handlePay = async (forceDecline) => {
        if (timeLeft <= 0) {
          setErr('La cotización de cambio ha expirado. Haz clic en "Refrescar cotización Pollar" para continuar con la tasa actual.');
          return;
        }

        setIsBusy(true);
        setErr(null);
        try {
          const res = await submitPayment({
            product: checkoutProduct,
            buyer: { name, country, address },
            cardLast4: forceDecline ? '0002' : '4242',
            forceDecline,
            quoteLock
          });
          if (!res.success) setErr(res.error);
          else setCheckoutProduct(null);
        } finally {
          setIsBusy(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
          <div className="modal-enter w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden">
            <div className="p-5 bg-gradient-to-r from-nodo-dark to-slate-800 text-white flex justify-between items-center">
              <div>
                <span className="font-bold text-sm">Pago Seguro con Tarjeta Internacional</span>
                <p className="text-[11px] text-slate-300 mt-0.5">Conexión cifrada PCI-DSS • Enlace Escrow Stellar</p>
              </div>
              <button onClick={() => setCheckoutProduct(null)} className="text-slate-400 hover:text-white transition"><Icon name="x" className="w-5 h-5"/></button>
            </div>

            <div className="p-5 space-y-4 text-xs">
              {/* Resumen Producto */}
              <div className="flex justify-between items-center p-4 bg-slate-50 border border-slate-200 rounded-xl">
                <div>
                  <h4 className="font-bold text-slate-900 text-sm">{checkoutProduct.name}</h4>
                  <p className="text-slate-500">${checkoutProduct.priceUsd} producto + ${checkoutProduct.shippingUsd} flete DHL</p>
                </div>
                <div className="text-right">
                  <span className="font-bold text-lg text-slate-900 font-mono">${totalUsd} <span className="text-xs font-normal text-slate-500">USD</span></span>
                </div>
              </div>

              {/* Insignia de Quote Lock de Pollar */}
              {timeLeft > 0 ? (
                <div className="p-3 bg-blue-50/80 border border-blue-200/80 rounded-xl flex items-center justify-between text-xs text-blue-900">
                  <div className="flex items-center space-x-2">
                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse flex-shrink-0"></span>
                    <span>
                      Cotización bloqueada por <strong className="font-mono text-sm">{formatCountdown(timeLeft)}</strong>
                    </span>
                  </div>
                  <div className="text-right font-mono text-[11px]">
                    <span className="text-blue-700 font-bold block">1 USD = {quoteLock?.rate.toFixed(2)} BOB</span>
                    <span className="text-[9px] text-blue-500">Ref: {quoteLock?.quoteId}</span>
                  </div>
                </div>
              ) : (
                <div className="p-3.5 bg-amber-50 border border-amber-300 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs text-amber-900">
                  <div className="flex items-center space-x-2">
                    <Icon name="warning" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                    <span>Cotización de 10 min expirada por seguridad de mercado.</span>
                  </div>
                  <button
                    onClick={handleRefreshQuote}
                    className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg transition text-[11px] whitespace-nowrap shadow-xs"
                  >
                    Refrescar cotización Pollar
                  </button>
                </div>
              )}

              <div className="space-y-2">
                <label className="font-semibold text-slate-700 block">1. Nombre y Dirección de Entrega:</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-nodo-blue/20 outline-none transition" placeholder="Nombre Completo"/>
                <input type="text" value={country} onChange={e => setCountry(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-nodo-blue/20 outline-none transition" placeholder="País"/>
                <input type="text" value={address} onChange={e => setAddress(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-nodo-blue/20 outline-none transition" placeholder="Dirección"/>
              </div>

              <div className="space-y-2">
                <label className="font-semibold text-slate-700 block">2. Tarjeta Internacional:</label>
                <div className="p-4 bg-gradient-to-br from-slate-800 to-nodo-dark text-white rounded-xl font-mono space-y-3">
                  <input type="text" value={cardNumber} onChange={e => setCardNumber(e.target.value)} className="w-full bg-slate-700/60 p-3 rounded-xl text-emerald-300 font-bold border border-slate-600 focus:border-emerald-400 outline-none transition"/>
                  <div className="grid grid-cols-2 gap-3">
                    <input type="text" value="11/28" readOnly className="bg-slate-700/60 p-2.5 rounded-xl text-center border border-slate-600"/>
                    <input type="password" value="892" readOnly className="bg-slate-700/60 p-2.5 rounded-xl text-center border border-slate-600"/>
                  </div>
                </div>
              </div>

              {err && <div className="p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl font-medium">{err}</div>}

              <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-900 flex items-center space-x-2">
                <Icon name="shield" className="w-4 h-4 text-emerald-600 flex-shrink-0" />
                <span><strong>Garantía Escrow Protegida:</strong> Tu dinero queda en custodia segura ($ USDC) hasta que DHL entregue en tu puerta.</span>
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex space-x-2 w-full sm:w-auto">
                <button
                  disabled={isBusy || timeLeft <= 0}
                  onClick={() => handlePay(false)}
                  className="flex-1 sm:flex-initial px-5 py-2.5 bg-nodo-dark hover:bg-slate-800 text-white font-bold rounded-xl transition disabled:opacity-40"
                >
                  {isBusy ? 'Procesando...' : `Pagar $${totalUsd} USD`}
                </button>
                <button
                  disabled={isBusy || timeLeft <= 0}
                  onClick={() => handlePay(true)}
                  className="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-700 font-semibold rounded-xl border border-red-200 transition disabled:opacity-40"
                >
                  Simular Rechazo
                </button>
              </div>
              <button onClick={() => setCheckoutProduct(null)} className="text-slate-400 hover:text-slate-700 text-xs transition">Cancelar</button>
            </div>
          </div>
        </div>
      );
    };

    const ReceiptModal = () => {
      const { receiptOrder, setReceiptOrder, liveFx } = useApp();
      if (!receiptOrder) return null;

      const o = receiptOrder;
      const date = new Date(o.date);
      const isSettled = o.status === 'SETTLED_BOB';

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
          <div className="modal-enter w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-5 bg-gradient-to-r from-nodo-dark to-slate-800 text-white flex justify-between items-center">
              <span className="font-bold text-sm">Comprobante Oficial de Compra & Escrow</span>
              <button onClick={() => setReceiptOrder(null)} className="text-slate-400 hover:text-white transition"><Icon name="x" className="w-5 h-5"/></button>
            </div>

            <div className="overflow-y-auto p-6 space-y-5" id="print-area">
              <div className="border border-slate-200 rounded-xl p-5 space-y-4 text-xs">
                {/* Header */}
                <div className="flex justify-between items-start border-b border-slate-100 pb-4">
                  <div>
                    <img src="./assets/imagotipo.png" alt="NODES" className="h-8 w-auto object-contain mb-2" onError={(e) => e.currentTarget.style.display = 'none'} />
                    <h4 className="font-extrabold text-base text-nodo-dark">NODES</h4>
                    <p className="text-slate-400 text-[11px]">Pasarela Transfronteriza (Stellar USDC ↔ Pollar)</p>
                  </div>
                  <div className="text-right">
                    <p className="font-mono font-bold text-slate-800">{o.id}</p>
                    <p className="text-slate-400 text-[11px]">{date.toLocaleDateString('es-BO')} • {date.toLocaleTimeString('es-BO', { hour12: false })}</p>
                  </div>
                </div>

                {/* Auth Code & Quote Lock */}
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                    <p className="text-[10px] text-emerald-600 font-semibold uppercase">Autorización Tarjeta</p>
                    <p className="font-mono font-bold text-emerald-900 text-base mt-0.5">{o.authCode}</p>
                  </div>
                  <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl">
                    <p className="text-[10px] text-blue-600 font-semibold uppercase">Quote Lock Pollar</p>
                    <p className="font-mono font-bold text-blue-900 text-sm mt-0.5">{o.checkoutQuoteId || 'QTE-DIRECT'}</p>

    // ========================================================================
    // ARDUINO ENGINE DRAWER (Slide from Right)

    // ========================================================================
    // MODAL DE DISPUTAS / REPORTAR PROBLEMA (COMPRADOR)
    // ========================================================================
    const DisputeModal = () => {
      const { disputeModalOrder, setDisputeModalOrder, openDispute } = useApp();
      const [reason, setReason] = useState('El producto no ha llegado en la fecha estimada');
      const [note, setNote] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      if (!disputeModalOrder) return null;

      const reasonsList = [
        'El producto no ha llegado en la fecha estimada',
        'El producto llegó con daños o defectuoso',
        'El contenido no coincide con la descripción del catálogo',
        'El código de rastreo del courier no registra movimientos',
        'Sospecha de extravío en aduana aérea'
      ];

      const handleConfirm = () => {
        setIsSubmitting(true);
        setTimeout(() => {
          openDispute(disputeModalOrder.id, reason, note);
          setIsSubmitting(false);
          setDisputeModalOrder(null);
        }, 400);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
          <div className="modal-enter w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div className="p-5 bg-gradient-to-r from-red-900 to-slate-900 text-white flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <Icon name="warning" className="w-5 h-5 text-red-400" />
                <span className="font-bold text-sm">Reportar Problema / Abrir Disputa</span>
              </div>
              <button onClick={() => setDisputeModalOrder(null)} className="text-slate-400 hover:text-white transition">
                <Icon name="x" className="w-5 h-5"/>
              </button>
            </div>

            <div className="p-6 space-y-4 text-xs">
              <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-900">
                <p className="font-bold">Protección de Compra NODO Escrow</p>
                <p className="text-[11px] text-red-700 mt-0.5">
                  Al abrir este reclamo, los fondos de la orden <strong>#{disputeModalOrder.id}</strong> quedan temporalmente congelados en el contrato hasta que nuestro equipo de mediación revise la evidencia de entrega con el transportista.
                </p>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-slate-800 block">Selecciona el motivo principal:</label>
                <div className="space-y-2 pt-1">
                  {reasonsList.map((r, i) => (
                    <label key={i} className="flex items-center space-x-2.5 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition">
                      <input
                        type="radio"
                        name="disputeReason"
                        value={r}
                        checked={reason === r}
                        onChange={e => setReason(e.target.value)}
                        className="accent-red-600"
                      />
                      <span className="text-slate-800 text-[11px] font-medium">{r}</span>
                    </label>
                  ))}
                </div>
              </div>

              <div className="space-y-1">
                <label className="font-bold text-slate-800 block">Comentarios adicionales o detalles del caso:</label>
                <textarea
                  value={note}
                  onChange={e => setNote(e.target.value)}
                  placeholder="Describe brevemente qué ocurrió para agilizar la revisión..."
                  rows={3}
                  className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-red-500/20 text-xs"
                />
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
              <button
                onClick={() => setDisputeModalOrder(null)}
                className="px-4 py-2 text-slate-500 hover:text-slate-800 transition text-xs"
              >
                Cancelar
              </button>
              <button
                disabled={isSubmitting}
                onClick={handleConfirm}
                className="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition disabled:opacity-50 shadow-xs"
              >
                {isSubmitting ? 'Registrando...' : 'Confirmar y Abrir Disputa'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ========================================================================
    // APP ROOT
    // ========================================================================
    const App = () => {
      const { viewMode } = useApp();

      return (
        <div className="min-h-screen flex flex-col bg-white">
          <TopNavbar />

          <main className="flex-1">
            {viewMode === 'HOME' && <HomeView />}
            <div className={viewMode !== 'HOME' ? 'max-w-7xl w-full mx-auto px-4 sm:px-6 pt-6' : 'hidden'}>
              {viewMode === 'BUYER' && <BuyerView />}
              {viewMode === 'PRODUCER' && <ProducerView />}
              {viewMode === 'BACKOFFICE' && <BackofficeView />}
            </div>
          </main>

          <ArduinoEngineDrawer />
          <HowItWorksModal />
          <SocialShareModal />
          <CheckoutModal />
          <ReceiptModal />
          <TaxInvoiceModal />
          <DisputeModal />

          <footer className="bg-white border-t border-[rgba(165,177,194,0.25)] py-8 mt-12 text-center">
            <img src="./assets/logotipo.png" alt="NODES" className="h-6 w-auto mx-auto mb-2 opacity-90 object-contain" onError={(e) => e.currentTarget.style.display = 'none'} />
            <div className="flex items-center justify-center space-x-2 mb-1">
              <span className="w-2 h-2 rounded-full bg-[#00F0FF]"></span>
              <p className="font-extrabold text-sm text-[#0A0E1A] tracking-wider">NODES</p>
            </div>
            <p className="text-[11px] text-[#A5B1C2] mt-0.5">Pasarela Transfronteriza de Pagos & E-commerce • Bolivia ↔ Global</p>
            <p className="text-[10px] text-slate-400 mt-0.5 font-mono">Infraestructura Web3 Invisible (Stellar USDC ↔ Pollar) • Compatible Apache / XAMPP</p>
          </footer>
        </div>
      );
    };

    // Mount
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>

</body>
</html>
